 while(plan.length<paths.length){const free=selected.filter(o=>!removed.has(o.id)&&o.blockers.every(b=>removed.has(b)));if(!free.length)throw Error('Invalid verified hell board');const id=free[0].id;removed.add(id);plan.push(id);}
 const palette=shuffle(['#f3df56','#ee65b9','#8bd669','#74c9ed']);palette.push('#ddd2ff');const colors=HELL_COLORS[bankIndex].map(c=>palette[c]);S.arrows=paths.map((p,id)=>({id,points:p.map(v=>({x:v%AW,y:Math.floor(v/AW)})),dir:selected[id].dir,color:colors[id],removed:false}));S.arrowPlan=plan;S.arrowMetrics={...ribbonMetrics(paths,{selected,plan}),fullCells:AW*AH};S.flyArrows=[];S.flashArrow=null;S.totalArrowCells=AW*AH;

function initArrowStage(){

}
function arrowPointerDown(e,p){

 if(arrowPointers.size>1){const [a,b]=[...arrowPointers.values()],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;arrowPinch={distance:Math.hypot(a.x-b.x,a.y-b.y),zoom:S.arrowView.zoom,world:arrowWorld(cx,cy)};pointer.moved=true;}ui();
}
function arrowPointerMove(e,p){

 if(arrowPointers.size>1&&arrowPinch){const [a,b]=[...arrowPointers.values()],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,v=S.arrowView;v.zoom=clamp(arrowPinch.zoom*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,arrowPinch.distance),1,4);v.x=cx-360-(arrowPinch.world.x-360)*v.zoom;v.y=cy-662-(arrowPinch.world.y-662)*v.zoom;clampArrowView();if(pointer)pointer.moved=true;ui();draw();return;}
 if(!pointer||pointer.id!==e.pointerId)return;const dx=p.x-pointer.x,dy=p.y-pointer.y;if(Math.hypot(dx,dy)>10)pointer.moved=true;if(pointer.moved){S.arrowView.x=pointer.view.x+dx;S.arrowView.y=pointer.view.y+dy;clampArrowView();draw();}
}
function arrowPointerUp(e,p,cancel=false){

 if(tap)actionAt(p.x,p.y);
 if(arrowPointers.size){const [id,q]=[...arrowPointers.entries()][0];pointer={...q,id,moved:true,view:{...S.arrowView}};}else pointer=null;ui();draw();
}

function actionAt(x,y){if(S.phase!=='play'||S.time<S.busy)return false;if(C.mode==='goods'){const p=goodsHit(x,y);if(!p||S.racks[p.rack].closed)return false;if(S.selected&&S.selected.rack!==p.rack)return moveGoods(S.selected,p);if(S.racks[p.rack].slots[p.slot]!==null){S.selected=p;chime();return true;}return false;}if(C.mode==='mahjong'){const hits=S.tiles.filter(t=>!t.removed).reverse().filter(t=>{const r=mahjongRect(t);return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;});return hits[0]?mahjongSelect(hits[0].id):false;}if(C.mode==='arrows'){const id=arrowHit(x,y);return id===undefined?false:selectArrow(id);}if(C.mode==='balls'&&x>140&&x<584&&y>330&&y<459)return releasePin();const col=Math.floor((x-S.boardX)/S.cell),row=Math.floor((y-S.boardY)/S.cell);return col>=0&&col<S.cols&&row>=0&&row<S.rows?blast(row*S.cols+col):false;}
function autoAction(){if(S.phase!=='play'||S.time<S.busy)return;if(C.mode==='goods')goodsAuto();else if(C.mode==='mahjong')mahjongAuto();else if(C.mode==='arrows')arrowAuto();else rescueAuto();}
function update(dt){S.frames++;if(S.phase==='play'&&(!S.started||S.autoPaused)){ui();return;}if(S.phase!=='play'){if(S.ending>=.7)return;S.ending=Math.min(.7,S.ending+dt);}else{S.time+=dt;if(!document.hidden||qa){if(['rocks','water','balls','valves'].includes(C.mode))rescueUpdate(dt);if(S.phase==='play'&&S.time>=C.seconds)end(false,'Time is up. Try again!');if(auto&&S.phase==='play'&&S.time>=S.nextAuto&&S.time>=S.busy){autoAction();S.nextAuto=S.time+C.autoInterval;}}}for(const f of S.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=450*dt;}S.fx=S.fx.filter(f=>f.t<f.life);for(const list of[S.flights,S.falling||[],S.flyArrows||[]]){for(const f of list)f.t+=dt;for(let i=list.length-1;i>=0;i--)if(list[i].t>=list[i].life)list.splice(i,1);}if(C.mode==='arrows'&&S.phase==='play'&&S.progress===C.goal&&!S.flyArrows.length)end(true,arrowLevel?'All 200 arrows escaped. Hell mode conquered!':'All 28 arrows escaped. Ready for 200 in HELL MODE?');ui();}
function draw(){ctx.lineJoin='round';ctx.lineCap='round';ctx.clearRect(0,0,720,1280);ctx.fillStyle='#b9ceb3';ctx.fillRect(0,0,720,1280);if(C.mode==='goods')drawGoods();else if(C.mode==='mahjong')drawMahjong();else if(C.mode==='arrows')drawArrows();else drawRescue();for(const f of S.fx){ctx.globalAlpha=Math.max(0,1-f.t/f.life);circle(f.x,f.y,f.size,f.col);}ctx.globalAlpha=1;}
const jjDrawOriginal=draw;draw=function(){jjDrawOriginal();jjView.present(c=>{const a=S.signal;if(!a||S.time-a.at>1.1)return;const q=Math.min(1,(S.time-a.at)/.6),p=jjView.screen(a.from.x,a.from.y),t=jjView.screen(a.to.x,a.to.y);c.save();c.strokeStyle=a.color;c.lineWidth=3;c.globalAlpha=1-(S.time-a.at)/1.1;c.setLineDash([5,5]);c.beginPath();c.moveTo(p.x,p.y);c.quadraticCurveTo(p.x,t.y,t.x,t.y);c.stroke();c.setLineDash([]);c.fillStyle=a.color;for(let k=0;k<3;k++){const v=Math.max(0,q-k*.07),x=(1-v)*(1-v)*p.x+2*(1-v)*v*p.x+v*v*t.x,y=(1-v)*(1-v)*p.y+2*(1-v)*v*t.y+v*v*t.y;c.beginPath();c.arc(x,y,5,0,Math.PI*2);c.fill();}c.beginPath();c.arc(t.x,t.y,10+Math.sin(q*Math.PI)*7,0,Math.PI*2);c.stroke();c.restore();});};
function localPoint(e){return jjView.inverse(e);}
canvas.addEventListener('pointerdown',e=>{if(S.phase!=='play')return;S.started=true;S.autoPaused=false;e.preventDefault();const p=localPoint(e);pointer={...p,id:e.pointerId,moved:false};canvas.setPointerCapture(e.pointerId);if(C.mode==='arrows'&&arrowLevel){arrowPointerDown(e,p);return;}if(C.mode==='goods'){const from=goodsHit(p.x,p.y);if(from&&!S.racks[from.rack].closed&&S.racks[from.rack].slots[from.slot]!==null)pointer.from=from;}});
canvas.addEventListener('pointermove',e=>{if(C.mode==='arrows'&&arrowLevel){arrowPointerMove(e,localPoint(e));return;}if(!pointer||pointer.id!==e.pointerId)return;const p=localPoint(e);if(Math.hypot(p.x-pointer.x,p.y-pointer.y)>12)pointer.moved=true;if(pointer.moved&&pointer.from){const f=pointer.from;S.drag={...f,type:S.racks[f.rack].slots[f.slot],...p};draw();}});
canvas.addEventListener('pointerup',e=>{if(C.mode==='arrows'&&arrowLevel){arrowPointerUp(e,localPoint(e));return;}if(!pointer||pointer.id!==e.pointerId)return;auto=false;const p=localPoint(e),from=pointer.from;if(pointer.moved&&from)moveGoods(from,goodsHit(p.x,p.y));else actionAt(p.x,p.y);S.drag=null;pointer=null;ui();draw();});canvas.addEventListener('pointercancel',e=>{if(C.mode==='arrows'&&arrowLevel){arrowPointerUp(e,localPoint(e),true);return;}S.drag=null;pointer=null;draw();});
$('auto').addEventListener('click',()=>{if(S.phase!=='play')return;auto=!auto;S.started=true;S.autoPaused=!auto;S.drag=null;pointer=null;S.nextAuto=S.time+.15;ui();});for(const id of['retry','resultRetry'])$(id).addEventListener('click',()=>reset());$('shuffle').addEventListener('click',mahjongShuffle);

window.__sevenPlayable={state};if(qa)Object.assign(window.__sevenPlayable,{reset,advance(seconds){for(let i=0;i<Math.ceil(seconds*60);i++)update(Math.min(1/60,seconds-i/60));draw();return state();},setAuto(v){auto=v;S.started=true;S.autoPaused=!v;S.nextAuto=S.time+.15;ui();},act:actionAt,moveGoods,selectArrow,selectTile:mahjongSelect,shuffle:mahjongShuffle,releasePin,autoAction,enterHellLevel,setArrowZoom,arrowPoint:(x,y)=>arrowScreen(AX+x*AC,AY+y*AC),coordinates:{slotPoint,tilePoint,mahjongRect,get arrowGrid(){return{x:AX,y:AY,cell:AC};}},solution:()=>S.solution});
if(C.mode==='arrows')installArrowControls();resize();reset(C.seed);if(C.mode==='arrows')nextSeed=C.seed+1;requestAnimationFrame(frame);
})();
