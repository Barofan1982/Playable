function pairedBoard(cols,rows,counts){const cells=Array(cols*rows).fill(null),units=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=y*cols+x;if(cells[i]!==null)continue;let j;if(y+1<rows&&x+1<cols&&cells[i+1]===null&&cells[i+cols]===null&&cells[i+cols+1]===null&&random()<.45){units.push([i,i+cols],[i+1,i+cols+1]);cells[i]=cells[i+1]=cells[i+cols]=cells[i+cols+1]=-1;x++;}else{j=i+1;if(x+1>=cols||cells[j]!==null)throw Error('Invalid pair tiling');units.push([i,j]);cells[i]=cells[j]=-1;x++;}}

function targetPairsBoard(target,counts){const candidates=[];for(let row=0;row<7;row++)for(let u=0;u<4;u++)if((row+u)%2===0)candidates.push(row*4+u);const positions=new Set(shuffle(candidates).slice(0,counts[target]/2)),other=[];for(let t=0;t<4;t++)if(t!==target)for(let j=0;j<counts[t]/2;j++)other.push(t);shuffle(other);const cells=[];for(let row=0;row<7;row++)for(let u=0;u<4;u++){const type=positions.has(row*4+u)?target:other.pop();cells.push(type,type);}return cells;}

 const style=document.createElement('style');style.textContent='#arrowTools{position:absolute;z-index:3;left:calc(69 * var(--u));right:calc(67 * var(--u));top:calc(1087 * var(--u));height:calc(54 * var(--u));display:flex;align-items:center;gap:calc(8 * var(--u))}#arrowTools[hidden],#nextLevel[hidden]{display:none}#arrowTools button{height:100%;min-width:calc(80 * var(--u));border:calc(2 * var(--u)) solid #7d6b94;border-radius:calc(12 * var(--u));background:#333148;color:#fff4d0;font-size:calc(26 * var(--u));font-weight:900}#zoomReadout{flex:1;text-align:center;color:#f7d68c;font-size:calc(20 * var(--u));font-weight:900}#arrowTools #fitView{font-size:calc(20 * var(--u));min-width:calc(150 * var(--u))}#result #nextLevel{display:block;width:100%;margin:0 0 calc(12 * var(--u));background:#e65384;color:#fff5db;border-color:#ffd0e3}#result #nextLevel[hidden]{display:none}';document.head.appendChild(style);
 const tools=document.createElement('nav');tools.id='arrowTools';tools.hidden=true;tools.setAttribute('aria-label','Puzzle zoom');tools.innerHTML='<button id="zoomOut" aria-label="Zoom out">−</button><span id="zoomReadout">100%</span><button id="zoomIn" aria-label="Zoom in">+</button><button id="fitView">FIT BOARD</button>';stage.appendChild(tools);
 const next=document.createElement('button');next.id='nextLevel';next.hidden=true;next.textContent='HELL MODE · 200 →';$('result').insertBefore(next,$('resultRetry'));
 $('zoomIn').addEventListener('click',()=>setArrowZoom(S.arrowView.zoom*1.5));$('zoomOut').addEventListener('click',()=>setArrowZoom(S.arrowView.zoom/1.5));$('fitView').addEventListener('click',()=>setArrowZoom(1));next.addEventListener('click',enterHellLevel);
 canvas.addEventListener('wheel',e=>{if(!arrowLevel||S.phase!=='play')return;const p=localPoint(e);if(p.y<248||p.y>1076)return;e.preventDefault();setArrowZoom(S.arrowView.zoom*Math.exp(-e.deltaY*.0015),p.x,p.y);},{passive:false});
}
function enterHellLevel(){if(C.mode!=='arrows'||arrowLevel||S.phase!=='win')return;const resume=S.completedAuto;reset(undefined,1);if(resume){auto=true;S.nextAuto=.5;ui();}}
function initHellArrows(){
 const mx=random()<.5,my=random()<.5,bankIndex=Math.floor(random()*HELL_RIBBONS.length),layout=HELL_RIBBONS[bankIndex],paths=layout.map(p=>p.map(v=>(my?AH-1-Math.floor(v/AW):Math.floor(v/AW))*AW+(mx?AW-1-v%AW:v%AW)));
 const owners=new Int16Array(AW*AH);paths.forEach((p,id)=>p.forEach(v=>owners[v]=id));
 const selected=paths.map((p,id)=>({id,...ribbonRay(p,false,owners)})),removed=new Set(),plan=[];
 while(plan.length<paths.length){const free=selected.filter(o=>!removed.has(o.id)&&o.blockers.every(b=>removed.has(b)));if(!free.length)throw Error('Invalid verified hell board');const id=free[0].id;removed.add(id);plan.push(id);}
 const palette=shuffle(['#f3df56','#ee65b9','#8bd669','#74c9ed']);palette.push('#ddd2ff');const colors=HELL_COLORS[bankIndex].map(c=>palette[c]);S.arrows=paths.map((p,id)=>({id,points:p.map(v=>({x:v%AW,y:Math.floor(v/AW)})),dir:selected[id].dir,color:colors[id],removed:false}));S.arrowPlan=plan;S.arrowMetrics={...ribbonMetrics(paths,{selected,plan}),fullCells:AW*AH};S.flyArrows=[];S.flashArrow=null;S.totalArrowCells=AW*AH;
}
function initArrowStage(){
 S.arrowLevel=arrowLevel+1;S.arrowView={zoom:1,x:0,y:0};S.completedAuto=false;arrowPointers.clear();arrowPinch=null;
 if(arrowLevel)initHellArrows();else initArrows();
 const owners=new Int16Array(AW*AH);S.arrows.forEach(a=>a.points.forEach(p=>owners[p.y*AW+p.x]=a.id));S.arrowBlockers=S.arrows.map(a=>{const h=a.points.at(-1),d=a.dir,b=new Set();for(let x=h.x+d[0],y=h.y+d[1];x>=0&&x<AW&&y>=0&&y<AH;x+=d[0],y+=d[1]){const id=owners[y*AW+x];if(id!==a.id)b.add(id);}return[...b];});
}
function arrowPointerDown(e,p){
 auto=false;arrowPointers.set(e.pointerId,p);pointer={...p,id:e.pointerId,moved:false,view:{...S.arrowView}};
 if(arrowPointers.size>1){const [a,b]=[...arrowPointers.values()],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;arrowPinch={distance:Math.hypot(a.x-b.x,a.y-b.y),zoom:S.arrowView.zoom,world:arrowWorld(cx,cy)};pointer.moved=true;}ui();
}
function arrowPointerMove(e,p){
 if(!arrowPointers.has(e.pointerId))return;arrowPointers.set(e.pointerId,p);
 if(arrowPointers.size>1&&arrowPinch){const [a,b]=[...arrowPointers.values()],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,v=S.arrowView;v.zoom=clamp(arrowPinch.zoom*Math.hypot(a.x-b.x,a.y-b.y)/Math.max(1,arrowPinch.distance),1,4);v.x=cx-360-(arrowPinch.world.x-360)*v.zoom;v.y=cy-662-(arrowPinch.world.y-662)*v.zoom;clampArrowView();if(pointer)pointer.moved=true;ui();draw();return;}
 if(!pointer||pointer.id!==e.pointerId)return;const dx=p.x-pointer.x,dy=p.y-pointer.y;if(Math.hypot(dx,dy)>10)pointer.moved=true;if(pointer.moved){S.arrowView.x=pointer.view.x+dx;S.arrowView.y=pointer.view.y+dy;clampArrowView();draw();}
}
function arrowPointerUp(e,p,cancel=false){
 if(!arrowPointers.has(e.pointerId))return;const tap=arrowPointers.size===1&&pointer?.id===e.pointerId&&!pointer.moved&&!cancel;arrowPointers.delete(e.pointerId);arrowPinch=null;
 if(tap)actionAt(p.x,p.y);
 if(arrowPointers.size){const [id,q]=[...arrowPointers.entries()][0];pointer={...q,id,moved:true,view:{...S.arrowView}};}else pointer=null;ui();draw();
}

function actionAt(x,y){if(S.phase!=='play'||S.time<S.busy)return false;if(C.mode==='goods'){const p=goodsHit(x,y);if(!p||S.racks[p.rack].closed)return false;if(S.selected&&S.selected.rack!==p.rack)return moveGoods(S.selected,p);if(S.racks[p.rack].slots[p.slot]!==null){S.selected=p;chime();return true;}return false;}if(C.mode==='mahjong'){const hits=S.tiles.filter(t=>!t.removed).reverse().filter(t=>{const r=mahjongRect(t);return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;});return hits[0]?mahjongSelect(hits[0].id):false;}if(C.mode==='arrows'){const id=arrowHit(x,y);return id===undefined?false:selectArrow(id);}if(C.mode==='balls'&&x>140&&x<584&&y>330&&y<459)return releasePin();const col=Math.floor((x-S.boardX)/S.cell),row=Math.floor((y-S.boardY)/S.cell);return col>=0&&col<S.cols&&row>=0&&row<S.rows?blast(row*S.cols+col):false;}
function autoAction(){if(S.phase!=='play'||S.time<S.busy)return;if(C.mode==='goods')goodsAuto();else if(C.mode==='mahjong')mahjongAuto();else if(C.mode==='arrows')arrowAuto();else rescueAuto();}
function update(dt){S.frames++;if(S.phase!=='play'){if(S.ending>=.7)return;S.ending=Math.min(.7,S.ending+dt);}else{S.time+=dt;if(!document.hidden||qa){if(['rocks','water','balls','valves'].includes(C.mode))rescueUpdate(dt);if(S.phase==='play'&&S.time>=C.seconds)end(false,'Time is up. Try again!');if(auto&&S.phase==='play'&&S.time>=S.nextAuto&&S.time>=S.busy){autoAction();S.nextAuto=S.time+C.autoInterval;}}}for(const f of S.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=450*dt;}S.fx=S.fx.filter(f=>f.t<f.life);for(const list of[S.flights,S.falling||[],S.flyArrows||[]]){for(const f of list)f.t+=dt;for(let i=list.length-1;i>=0;i--)if(list[i].t>=list[i].life)list.splice(i,1);}if(C.mode==='arrows'&&S.phase==='play'&&S.progress===C.goal&&!S.flyArrows.length)end(true,arrowLevel?'All 200 arrows escaped. Hell mode conquered!':'All 28 arrows escaped. Ready for 200 in HELL MODE?');ui();}
function draw(){ctx.lineJoin='round';ctx.lineCap='round';ctx.clearRect(0,0,720,1280);ctx.fillStyle='#b9ceb3';ctx.fillRect(0,0,720,1280);if(C.mode==='goods')drawGoods();else if(C.mode==='mahjong')drawMahjong();else if(C.mode==='arrows')drawArrows();else drawRescue();for(const f of S.fx){ctx.globalAlpha=Math.max(0,1-f.t/f.life);circle(f.x,f.y,f.size,f.col);}ctx.globalAlpha=1;}
function localPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.x)*720/r.width,y:(e.clientY-r.y)*1280/r.height};}
canvas.addEventListener('pointerdown',e=>{if(S.phase!=='play')return;e.preventDefault();const p=localPoint(e);pointer={...p,id:e.pointerId,moved:false};canvas.setPointerCapture(e.pointerId);if(C.mode==='arrows'&&arrowLevel){arrowPointerDown(e,p);return;}if(C.mode==='goods'){const from=goodsHit(p.x,p.y);if(from&&!S.racks[from.rack].closed&&S.racks[from.rack].slots[from.slot]!==null)pointer.from=from;}});
canvas.addEventListener('pointermove',e=>{if(C.mode==='arrows'&&arrowLevel){arrowPointerMove(e,localPoint(e));return;}if(!pointer||pointer.id!==e.pointerId)return;const p=localPoint(e);if(Math.hypot(p.x-pointer.x,p.y-pointer.y)>12)pointer.moved=true;if(pointer.moved&&pointer.from){const f=pointer.from;S.drag={...f,type:S.racks[f.rack].slots[f.slot],...p};draw();}});
canvas.addEventListener('pointerup',e=>{if(C.mode==='arrows'&&arrowLevel){arrowPointerUp(e,localPoint(e));return;}if(!pointer||pointer.id!==e.pointerId)return;auto=false;const p=localPoint(e),from=pointer.from;if(pointer.moved&&from)moveGoods(from,goodsHit(p.x,p.y));else actionAt(p.x,p.y);S.drag=null;pointer=null;ui();draw();});canvas.addEventListener('pointercancel',e=>{if(C.mode==='arrows'&&arrowLevel){arrowPointerUp(e,localPoint(e),true);return;}S.drag=null;pointer=null;draw();});
$('auto').addEventListener('click',()=>{if(S.phase!=='play')return;auto=!auto;S.drag=null;pointer=null;S.nextAuto=S.time+.15;ui();});for(const id of['retry','resultRetry'])$(id).addEventListener('click',()=>reset());$('sound').addEventListener('click',()=>{soundOn=!soundOn;window.__journeyAudio.setEnabled(soundOn);$('sound').setAttribute('aria-pressed',String(soundOn));$('sound').textContent=soundOn?'♫':'♪';if(soundOn)chime();});$('shuffle').addEventListener('click',mahjongShuffle);
function resize(){stage.style.setProperty('--u',stage.getBoundingClientRect().width/720+'px');}window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>last=performance.now());
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(!document.hidden){update(dt);draw();}requestAnimationFrame(frame);}
function state(){const common={id:C.id,mode:C.mode,phase:S.phase,time:+S.time.toFixed(3),ending:S.ending,auto,progress:S.progress,goal:C.goal,moves:S.moves,errors:S.errors,seed:S.seed,actions:S.actions,frames:S.frames};if(C.mode==='goods')return{...common,racks:S.racks,selected:S.selected,conserved:S.racks.reduce((n,r)=>n+r.slots.filter(t=>t!==null).length,0)+S.progress*3===48};if(C.mode==='mahjong')return{...common,tiles:S.tiles.map(t=>({...t,free:tileFree(t),rect:mahjongRect(t)})),availablePairs:availablePairs(),shuffles:S.shuffles,conserved:S.tiles.filter(t=>!t.removed).length+S.progress*2===68};if(C.mode==='arrows')return{...common,level:arrowLevel+1,levelCount:2,view:{...S.arrowView},canEnterHell:S.phase==='win'&&!arrowLevel,arrows:S.arrows.map(a=>({...a,free:arrowClear(a)})),grid:{cols:AW,rows:AH},metrics:S.arrowMetrics,initialOccupiedCells:S.totalArrowCells,occupiedCells:S.arrows.filter(a=>!a.removed).reduce((n,a)=>n+a.points.length,0),flyArrows:S.flyArrows.map(a=>({id:a.id,t:a.t,life:a.life,shape:arrowShape(a,a.t/a.life),length:(a.points.length-1)*AC})),conserved:S.arrows.filter(a=>!a.removed).length+S.progress===C.goal};return{...common,board:S.board,cols:S.cols,rows:S.rows,cell:S.cell,boardX:S.boardX,boardY:S.boardY,groups:tileGroups(),heroBounds:C.mode==='rocks'?rockHeroBounds():C.mode==='valves'&&S.room===2?{x:188-30,y:994-162*.74,w:60,h:162*.74}:null,rockGap:C.mode==='rocks'?rockGap():null,rockFront:C.mode==='rocks'?rockFrontAt(S.rockHero.x):null,rockDebris:C.mode==='rocks'?S.rockDebris:null,water:S.water,plates:S.plates,fire:S.fire,charge:S.charge,releases:S.releases,room:S.room,yellow:S.yellow,yellowTarget:S.yellowTarget,red:S.red,conserved:S.board.filter(t=>t!==null).length+S.removed+S.discardedTiles===S.generatedTiles};}
window.__sevenPlayable={state};if(qa)Object.assign(window.__sevenPlayable,{reset,advance(seconds){for(let i=0;i<Math.ceil(seconds*60);i++)update(Math.min(1/60,seconds-i/60));draw();return state();},setAuto(v){auto=v;S.nextAuto=S.time+.15;ui();},act:actionAt,moveGoods,selectArrow,selectTile:mahjongSelect,shuffle:mahjongShuffle,releasePin,autoAction,enterHellLevel,setArrowZoom,arrowPoint:(x,y)=>arrowScreen(AX+x*AC,AY+y*AC),coordinates:{slotPoint,tilePoint,mahjongRect,get arrowGrid(){return{x:AX,y:AY,cell:AC};}},solution:()=>S.solution});
if(C.mode==='arrows')installArrowControls();resize();reset(C.seed);if(C.mode==='arrows')nextSeed=C.seed+1;requestAnimationFrame(frame);
})();

</script></body></html>
