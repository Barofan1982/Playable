 const COOK=4.8,BURN=10.5,CAPACITY=8;
 const ORDERS=[
  {guest:'seagull',items:[4,5],sauce:0},
  {guest:'zuri',items:[0,1,3],sauce:1},
  {guest:'oli',items:[2,6,5,3],sauce:0},
  {guest:'chloe',items:[0,1,2,3,5,6],sauce:1},
  {guest:'seagull',items:[4,4,5,5,3],sauce:0}
 ];
 function init(){return{phase:'ready',stage:'prep',order:0,selected:[],sauce:-1,cookTime:0,burned:false,undercooked:false,mistakes:0,coins:0,time:0,served:0,events:[],lastError:null};}
 function current(s){return ORDERS[s.order];}
 function start(s){if(s.phase==='ready')s.phase='play';return s.phase==='play';}
 function event(s,kind,extra={}){s.events.push({kind,time:s.time,...extra});if(s.events.length>100)s.events.shift();}
 function add(s,id){if(!start(s)||s.stage!=='prep'||!Number.isInteger(id)||id<0||id>7)return false;if(s.selected.length>=CAPACITY)return false;s.selected.push(id);event(s,'pick',{id});return true;}
 function remove(s,index){if(s.phase!=='play'||s.stage!=='prep'||index<0||index>=s.selected.length)return false;s.selected.splice(index,1);event(s,'remove');return true;}
 function cook(s){if(!start(s)||s.stage!=='prep'||!s.selected.length)return false;s.stage='cooking';s.cookTime=0;s.burned=false;s.undercooked=false;event(s,'cook');return true;}
 function lift(s){if(s.phase!=='play'||!['cooking','cooked','burned'].includes(s.stage))return false;s.undercooked=s.cookTime<COOK;s.burned=s.cookTime>=BURN;s.stage='plated';event(s,'lift');return true;}
 function sauce(s,id){if(s.phase!=='play'||s.stage!=='plated'||![0,1].includes(id))return false;s.sauce=id;event(s,'sauce',{id});return true;}
 const equal=(a,b)=>a.length===b.length&&a.slice().sort().every((v,i)=>v===b.slice().sort()[i]);
 function serve(s){if(s.phase!=='play'||s.stage!=='plated')return false;const o=current(s),valid=equal(s.selected,o.items)&&s.sauce===o.sauce&&!s.burned&&!s.undercooked;
  if(valid){s.coins+=80+o.items.length*15;s.order++;s.served++;event(s,'serve');}else{s.mistakes++;s.lastError=s.burned?'burned':s.undercooked?'raw':!equal(s.selected,o.items)?'recipe':'sauce';event(s,'wrong',{reason:s.lastError});}
  s.selected=[];s.sauce=-1;s.cookTime=0;s.burned=false;s.undercooked=false;s.stage='prep';if(s.mistakes>=3)s.phase='lost';else if(s.order===ORDERS.length)s.phase='won';return valid;
 }
 function step(s,dt){if(s.phase!=='play')return;dt=Math.max(0,Math.min(.1,dt));s.time+=dt;if(['cooking','cooked','burned'].includes(s.stage)){s.cookTime+=dt;if(s.cookTime>=BURN&&s.stage!=='burned'){s.stage='burned';event(s,'burn');}else if(s.cookTime>=COOK&&s.stage==='cooking'){s.stage='cooked';event(s,'ready');}}}
 function autoAction(s){if(!start(s))return false;const o=current(s);if(s.stage==='prep'){for(let id=0;id<8;id++){const need=o.items.filter(v=>v===id).length,have=s.selected.filter(v=>v===id).length;if(have>need)return remove(s,s.selected.indexOf(id));}
  for(const id of o.items)if(s.selected.filter(v=>v===id).length<o.items.filter(v=>v===id).length)return add(s,id);return cook(s);
 }if(s.stage==='cooked')return lift(s);if(s.stage==='burned')return lift(s);if(s.stage==='plated'){if(s.sauce!==o.sauce)return sauce(s,o.sauce);return serve(s);}return false;}

})();
