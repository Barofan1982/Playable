function text(s,x,y,size=26,color='#fff',align='center'){ctx.save();ctx.textAlign=align;ctx.textBaseline='middle';ctx.font='800 '+size+'px Arial,"Microsoft YaHei"';ctx.lineJoin='round';ctx.strokeStyle='#173747';ctx.lineWidth=size*.15;ctx.strokeText(s,x,y);ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.restore();}
function imageFit(img,x,y,w,h){if(!img)return;const sc=Math.min(w/img.width,h/img.height),dw=img.width*sc,dh=img.height*sc;ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);}
function tile(k,x,y,size,selected=false){if(!k)return;ctx.save();if(selected){ctx.shadowColor='#74ff39';ctx.shadowBlur=22;round(x-2,y-2,size+4,size+2,17);ctx.fillStyle='#6bf345';ctx.fill();}ctx.shadowColor='#25493c85';ctx.shadowBlur=4;ctx.shadowOffsetY=4;round(x,y+3,size,size-3,16);const edge=ctx.createLinearGradient(0,y,0,y+size);edge.addColorStop(0,'#d1c5a8');edge.addColorStop(.82,'#ccb996');edge.addColorStop(1,'#896b44');ctx.fillStyle=edge;ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='#927d5b';ctx.lineWidth=1.5;ctx.stroke();round(x+.7,y+.3,size-1.4,size-7,15);const face=ctx.createLinearGradient(x,y,x+size*.25,y+size);face.addColorStop(0,'#fffffb');face.addColorStop(.8,'#fffdf4');face.addColorStop(1,'#f6f0dd');ctx.fillStyle=face;ctx.fill();ctx.strokeStyle='#ded4bb';ctx.lineWidth=1.3;ctx.stroke();imageFit(imgs.sprites[k],x+9,y+7,size-18,size-18);if(selected){ctx.strokeStyle='#75ee47';ctx.lineWidth=5;round(x+2,y+2,size-4,size-8,14);ctx.stroke();}ctx.restore();}
function pos(i){return{x:BOARD.x+(i%7)*BOARD.cell,y:BOARD.y+Math.floor(i/7)*BOARD.cell};}
function hit(x,y){const col=Math.floor((x-BOARD.x)/BOARD.cell),row=Math.floor((y-BOARD.y)/BOARD.cell);return col>=0&&col<7&&row>=0&&row<11?row*7+col:-1;}
function initSound(){usedSound=true;try{if(!soundContext)soundContext=new(window.AudioContext||window.webkitAudioContext)();if(soundContext.state==='suspended'&&!hidden&&!paused)soundContext.resume();}catch(e){}}
function sound(type='pick'){if(!usedSound||hidden||paused||!soundContext)return;try{const t=soundContext.currentTime,o=soundContext.createOscillator(),g=soundContext.createGain();o.type='sine';o.frequency.setValueAtTime(type==='wrong'?180:type==='win'?750:430+state.path.length*24,t);o.frequency.exponentialRampToValueAtTime(type==='wrong'?120:850,t+.09);g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.0001,t+.13);o.connect(g);g.connect(soundContext.destination);o.start(t);o.stop(t+.15);}catch(e){}}
function tap(i){i=Number(i);if(!ready||paused||hidden||state.status!=='playing'||state.phase!=='idle'||i<0||i>=77||!state.board[i])return false;if(!state.path.length){state.path=[i];state.selectedType=state.board[i];sound();return true;}const lastIndex=state.path.at(-1);if(i===lastIndex)return true;if(state.path.length>1&&i===state.path.at(-2)){state.path.pop();return true;}if(state.path.includes(i)||!R.adjacent(lastIndex,i)||state.board[i]!==state.selectedType)return false;state.path.push(i);sound();return true;}
function commit(path=state.path){if(!ready||paused||hidden||state.status!=='playing'||state.phase!=='idle')return false;path=path.slice();if(!R.valid(state.board,path)){state.path=[];state.selectedType=null;toastUntil=clock+1500;return false;}const kind=state.board[path[0]],gi=R.GOALS.indexOf(kind),before=state.board.slice();state.before=before;state.path=[];state.selectedType=null;state.moves++;state.phase='collect';state.phaseUntil=clock+620+path.length*25;state.flights=path.map((index,n)=>{const p=pos(index);state.board[index]=null;return{kind,index,gi,x:p.x+47,y:p.y+47,start:clock+n*25,end:clock+470+n*25,arrived:false};});state.pendingPath=path;state.autoPath=null;sound();return true;}
function finish(ok){state.status=ok?'success':'failed';state.auto=false;state.path=[];state.autoPath=null;state.phase='idle';paused=false;sound(ok?'win':'wrong');sync();}
function solve(){return R.solve(state.board,state.remaining,state.moves===0);}
function startAuto(){initSound();if(state.status!=='playing')reset();if(state.phase==='idle'){state.path=[];state.selectedType=null;}state.auto=true;paused=false;state.autoAt=clock+450;sync();return snapshot();}
function tick(dt){if(hidden||paused||!ready)return;clock+=dt;state.elapsed+=dt;if(state.status!=='playing')return;if(state.phase==='collect'){for(const f of state.flights)if(!f.arrived&&clock>=f.end){f.arrived=true;if(f.gi>=0&&state.remaining[f.gi]>0)state.remaining[f.gi]--;sound();}if(clock>=state.phaseUntil){const collapsed=R.collapse(state.before,state.pendingPath,state.deck,state.used);state.board=collapsed.board;state.falls=collapsed.falls.map(f=>({...f,start:clock,end:clock+390}));state.flights=[];state.phase='fall';state.phaseUntil=clock+410;}return;}if(state.phase==='fall'){if(clock>=state.phaseUntil){state.falls=[];state.phase='idle';state.completed=state.remaining.filter(n=>n===0).length;state.autoAt=clock+170;if(state.remaining.every(n=>n===0))finish(true);else if(state.moves>=MOVE_LIMIT||!R.TYPES.some(k=>R.components(state.board,k).length))finish(false);}return;}if(state.auto&&clock>=state.autoAt){if(!state.autoPath){state.autoPath=solve();state.autoIndex=0;state.path=[];state.selectedType=null;state.nextSelect=clock;if(!state.autoPath.length){finish(false);return;}}if(clock>=state.nextSelect){if(state.autoIndex<state.autoPath.length){tap(state.autoPath[state.autoIndex++]);state.nextSelect=clock+76;}else{commit(state.autoPath);state.autoAt=clock+1300;}}}}
function drawGoals(){ctx.save();ctx.shadowColor='#2116097a';ctx.shadowBlur=8;ctx.shadowOffsetY=6;round(0,-10,720,150,20);ctx.fillStyle='#624124';ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='#ba8952';ctx.lineWidth=3;ctx.stroke();ctx.restore();for(let i=0;i<6;i++){const x=10+i*119,y=5,w=107,h=127;ctx.save();round(x,y,w,h,15);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#ceb381');g.addColorStop(1,'#b79c6d');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#fff7df';ctx.lineWidth=3;ctx.stroke();imageFit(imgs.sprites[R.GOALS[i]],x+13,y+33,w-26,h-40);ctx.beginPath();ctx.moveTo(x+3,y+25);ctx.lineTo(x+3,y+3);ctx.lineTo(x+48,y+3);ctx.quadraticCurveTo(x+46,y+30,x+3,y+39);ctx.closePath();ctx.fillStyle='#fffbed';ctx.fill();text(state.remaining[i]===0?'✓':String(state.remaining[i]),x+20,y+17,28,state.remaining[i]===0?'#60c82c':'#101820');if(!state.remaining[i]){ctx.fillStyle='#ffe48855';round(x,y,w,h,15);ctx.fill();}ctx.restore();}}
function draw(){ctx.clearRect(0,0,W,H);if(imgs.background)ctx.drawImage(imgs.background,0,0,W,H);else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3f8eaf');g.addColorStop(1,'#9abfc9');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}if(!ready){text('Loading garden tiles',360,650,30);return;}drawGoals();text(toastUntil>clock?'Connect 3+ matching flowers':'Diagonal links work too',255,161,24,'#fffbee');text('Moves '+(MOVE_LIMIT-state.moves),624,161,24,'#fff7cf');ctx.save();ctx.beginPath();ctx.rect(0,174,720,1106);ctx.clip();const selected=new Set(state.path),fallMap=new Map(state.falls.map(f=>[f.index,f]));for(let i=0;i<77;i++){const p=pos(i),fall=fallMap.get(i);let y=p.y;if(fall){const t=Math.min(1,(clock-fall.start)/(fall.end-fall.start)),e=1-(1-t)**3;y=BOARD.y+(fall.from+(fall.to-fall.from)*e)*BOARD.cell;}tile(state.board[i],p.x,y,96,selected.has(i));}if(state.path.length>1){ctx.save();ctx.strokeStyle='#a8ff6255';ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();state.path.forEach((i,n)=>{const p=pos(i);if(n)ctx.lineTo(p.x+48,p.y+44);else ctx.moveTo(p.x+48,p.y+44);});ctx.stroke();ctx.restore();}ctx.restore();for(const f of state.flights){if(f.arrived)continue;const t=Math.max(0,Math.min(1,(clock-f.start)/(f.end-f.start))),e=1-(1-t)**2,x=f.gi>=0?63+f.gi*119:360,y=f.gi>=0?80:154;tile(f.kind,f.x+(x-f.x)*e-40*(1-t*.45),f.y+(y-f.y)*e-40*(1-t*.45)-Math.sin(t*Math.PI)*80,80*(1-t*.45),true);}
if(paused||state.status!=='playing'){ctx.fillStyle='#13384888';ctx.fillRect(0,0,W,H);ctx.save();ctx.shadowColor='#0005';ctx.shadowBlur=18;round(76,444,568,315,33);ctx.fillStyle='#fff5dc';ctx.fill();ctx.shadowBlur=0;text(paused?'Paused':state.status==='success'?'Garden complete!':'Try again',360,528,43,state.status==='success'?'#5c8c36':'#285567');text(paused?'Tap Continue to resume':state.status==='success'?'All six goals complete':'Connect flowers. Watch moves.',360,610,27,'#325463');text(paused?'Auto linking is paused':'Tap Retry to start again',360,684,25,'#325463');ctx.restore();}}
function step(ms=16){const n=Math.max(0,Math.min(Number(ms)||0,30000));let left=n;while(left>0){const d=Math.min(50,left);tick(d);left-=d;}draw();return snapshot();}
function animate(t){const dt=last?Math.min(50,t-last):0;last=t;tick(dt);draw();requestAnimationFrame(animate);}
function eventPoint(e){const r=canvas.getBoundingClientRect(),scale=Math.min(r.width/W,r.height/H),ox=(r.width-W*scale)/2,oy=(r.height-H*scale)/2;return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale};}
canvas.addEventListener('pointerdown',e=>{if(state.auto||paused||hidden||state.phase!=='idle')return;initSound();const p=eventPoint(e),i=hit(p.x,p.y);if(i<0)return;state.path=[];state.selectedType=null;tap(i);lastPoint=p;dragging=true;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!dragging||state.auto||paused||hidden)return;const p=eventPoint(e);if(lastPoint){const count=Math.max(1,Math.ceil(Math.hypot(p.x-lastPoint.x,p.y-lastPoint.y)/24));for(let j=1;j<=count;j++){const t=j/count,i=hit(lastPoint.x+(p.x-lastPoint.x)*t,lastPoint.y+(p.y-lastPoint.y)*t);if(i>=0)tap(i);}}lastPoint=p;});
canvas.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;lastPoint=null;commit();});canvas.addEventListener('pointercancel',()=>{dragging=false;lastPoint=null;state.path=[];state.selectedType=null;});
autoBtn.onclick=startAuto;pauseBtn.onclick=()=>{paused=!paused;if(soundContext){if(paused)soundContext.suspend();else if(!hidden)soundContext.resume();}sync();};retryBtn.onclick=()=>{initSound();reset();};document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=0;dragging=false;lastPoint=null;if(!state.auto){state.path=[];state.selectedType=null;}if(soundContext){if(hidden)soundContext.suspend();else if(!paused)soundContext.resume();}});window.addEventListener('pagehide',()=>{hidden=true;if(soundContext)soundContext.suspend();});window.addEventListener('pageshow',()=>{hidden=document.hidden;last=0;});
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function load(){imgs.background=ASSETS.background?await loadImage(ASSETS.background):null;for(const group of ['sprites','tiles'])for(const [k,v] of Object.entries(ASSETS[group]||{}))imgs[group][k]=await loadImage(v);ready=true;}
let adHidden=false;function adVisibility(visible){adHidden=!visible;hidden=document.hidden||adHidden;last=0;dragging=false;lastPoint=null;if(state&&!state.auto){state.path=[];state.selectedType=null;}if(soundContext){if(hidden)soundContext.suspend();else if(!paused)soundContext.resume();}}try{if(window.mraid&&typeof window.mraid.addEventListener==='function'){window.mraid.addEventListener('viewableChange',adVisibility);if(typeof window.mraid.isViewable==='function')adVisibility(window.mraid.isViewable());}}catch(e){}document.addEventListener('visibilitychange',()=>{if(adHidden)adVisibility(false);});window.addEventListener('pageshow',()=>{if(adHidden)adVisibility(false);});
window.__QA={state:snapshot,startAuto,reset,tap,solve,step,fail:()=>{finish(false);draw();return snapshot();},hooks:{commit,valid:path=>R.valid(state.board,path),adjacent:R.adjacent,hide:()=>{hidden=true;},show:()=>{hidden=false;last=0;},adVisibility,pause:()=>{paused=true;sync();},resume:()=>{paused=false;sync();},hit,pos}};
window.__PLAYABLE=window.__QA;reset();load().catch(()=>{state.status='failed';}).finally(()=>draw());requestAnimationFrame(animate);

</script></body></html>
