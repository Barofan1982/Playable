function pairedBoard(cols,rows,counts){const cells=Array(cols*rows).fill(null),units=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=y*cols+x;if(cells[i]!==null)continue;let j;if(y+1<rows&&x+1<cols&&cells[i+1]===null&&cells[i+cols]===null&&cells[i+cols+1]===null&&random()<.45){units.push([i,i+cols],[i+1,i+cols+1]);cells[i]=cells[i+1]=cells[i+cols]=cells[i+cols+1]=-1;x++;}else{j=i+1;if(x+1>=cols||cells[j]!==null)throw Error('Invalid pair tiling');units.push([i,j]);cells[i]=cells[j]=-1;x++;}}

function initRescue(){S.cols=C.mode==='rocks'?10:8;S.rows=7;S.cell=C.mode==='rocks'?59:68;S.boardX=(720-S.cols*S.cell)/2;S.boardY=C.mode==='rocks'?680:632;S.board=C.mode==='balls'?targetPairsBoard(2,[12,8,24,12]):C.mode==='valves'?targetPairsBoard(1,[12,24,10,10]):pairedBoard(S.cols,S.rows);S.initialTiles=S.board.length;S.generatedTiles=S.initialTiles;S.discardedTiles=0;S.removed=0;S.rocks=Array.from({length:310},()=>({u:random(),v:random(),r:2+random()*5}));S.plates=Array(S.cols).fill(6);S.water=.40;S.fire=C.mode==='balls'?.48:.8;S.charge=0;S.releases=0;S.coolQueue=[];S.falling=[];S.room=1;S.yellow=0;S.yellowTarget=24;S.red=0;S.roomTransition=0;S.waterOpen=false;}

// Mahjong: a tile must be uncovered and have an open left or right side.
function initMahjong(){S.tiles=[];for(let level=0;level<3;level++)for(let row=level;row<6-level;row++)for(let col=level;col<7-level;col++)S.tiles.push({id:S.tiles.length,row,col,level,type:0,removed:false});S.shuffles=2;S.solution=[];assignMahjong();}
function tileFree(t,removed){const present=p=>removed?!removed.has(p.id):!p.removed;if(!present(t))return false;if(S.tiles.some(p=>present(p)&&p.level>t.level&&p.row===t.row&&p.col===t.col))return false;const left=S.tiles.some(p=>present(p)&&p.level===t.level&&p.row===t.row&&p.col===t.col-1),right=S.tiles.some(p=>present(p)&&p.level===t.level&&p.row===t.row&&p.col===t.col+1);return!left||!right;}
function assignMahjong(){const gone=new Set(S.tiles.filter(t=>t.removed).map(t=>t.id)),memo=new Set(),kinds=[];if(S.actions.length){const counts=new Map();for(const t of S.tiles)if(!t.removed)counts.set(t.type,(counts.get(t.type)||0)+1);for(const [type,n]of counts){if(n%2)throw Error('Unpaired Mahjong kind');for(let i=0;i<n/2;i++)kinds.push(type);}shuffle(kinds);}let nodes=0;function geometry(){if(gone.size===S.tiles.length)return[];if(++nodes>60000)return null;const key=[...gone].sort((a,b)=>a-b).join(',');if(memo.has(key))return null;memo.add(key);const free=shuffle(S.tiles.filter(t=>tileFree(t,gone))),pairs=[];for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++)pairs.push([free[i],free[j]]);pairs.sort((a,b)=>(b[0].level+b[1].level)-(a[0].level+a[1].level));for(const [a,b]of pairs){gone.add(a.id);gone.add(b.id);const tail=geometry();gone.delete(a.id);gone.delete(b.id);if(tail)return[[a.id,b.id],...tail];}return null;}const plan=geometry();if(!plan)throw Error('Mahjong geometry cannot be paired');plan.forEach(([a,b],i)=>S.tiles[a].type=S.tiles[b].type=kinds.length?kinds[i]:i%16);S.solution=plan;}
function availablePairs(){const free=S.tiles.filter(t=>tileFree(t)),pairs=[];for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++)if(free[i].type===free[j].type)pairs.push([free[i].id,free[j].id]);return pairs;}
function solveMahjong(){const gone=new Set(S.tiles.filter(t=>t.removed).map(t=>t.id)),memo=new Set();let nodes=0;function dfs(){if(gone.size===S.tiles.length)return[];if(++nodes>60000)return null;const key=[...gone].sort((a,b)=>a-b).join(',');if(memo.has(key))return null;memo.add(key);const free=S.tiles.filter(t=>tileFree(t,gone)),pairs=[];for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++)if(free[i].type===free[j].type)pairs.push([free[i].id,free[j].id]);pairs.sort((a,b)=>(S.tiles[b[0]].level+S.tiles[b[1]].level)-(S.tiles[a[0]].level+S.tiles[a[1]].level));for(const [a,b]of pairs){gone.add(a);gone.add(b);const tail=dfs();gone.delete(a);gone.delete(b);if(tail)return[[a,b],...tail];}return null;}return dfs();}
const mahjongRect=t=>({x:77+t.col*78+t.level*9,y:318+t.row*99-t.level*12,w:76,h:94});
function mahjongSelect(id){if(S.phase!=='play'||S.time<S.busy)return false;const tile=S.tiles[id];if(!tile||!tileFree(tile)){feedback('Covered or side-blocked · choose a FREE tile');return false;}if(S.selected===id){S.selected=null;return true;}if(S.selected===null){S.selected=id;chime();return true;}const first=S.tiles[S.selected];if(first.type!==tile.type){S.errors++;S.selected=id;feedback('These tiles do not match');chime('bad');record('mismatch',{a:first.id,b:id});if(S.errors>=5)end(false,'Five mismatches. Look for identical free tiles.');return false;}first.removed=tile.removed=true;S.progress++;S.selected=null;S.busy=S.time+.27;for(const t of[first,tile]){const r=mahjongRect(t);burst(r.x+38,r.y+47,'#f4cf67',12);}record('pair',{a:first.id,b:id,type:tile.type});chime();if(S.progress===C.goal)end(true,'All 34 pairs matched. Good Job!');else if(!availablePairs().length&&!S.shuffles)end(false,'No free matching pair remains. Try a different order.');return true;}
function mahjongShuffle(){if(S.phase!=='play'||!S.shuffles||S.time<S.busy)return false;try{assignMahjong();S.shuffles--;S.selected=null;S.busy=S.time+.3;feedback('Tiles reshuffled · '+S.shuffles+' left');record('shuffle');ui();return true;}catch{end(false,'No playable tile pair remains. Try again.');return false;}}
function mahjongAuto(){if(S.solution.some(([a,b])=>S.tiles[a].removed!==S.tiles[b].removed)){const solution=solveMahjong();if(solution)S.solution=solution;else{if(S.shuffles)mahjongShuffle();else end(false,'No free matching pair remains.');return;}}const valid=S.solution.find(([a,b])=>!S.tiles[a].removed&&!S.tiles[b].removed&&tileFree(S.tiles[a])&&tileFree(S.tiles[b]));let plan=valid?[valid]:solveMahjong();if(!plan?.length){if(S.shuffles)mahjongShuffle();else end(false,'No free matching pair remains.');return;}const [a,b]=plan[0];S.selected=null;mahjongSelect(a);mahjongSelect(b);}
function mahjongFace(type,x,y){const chars=['中','發','東','南','西','北','一','三','四','六'];if(type<10){text(chars[type],x,y,44,type===0?'#b84040':type===1?'#37875d':'#3c6274');return;}if(type<13){const n=type===10?2:type===11?4:6;for(let i=0;i<n;i++){const px=x+(i%2-.5)*24,py=y+(Math.floor(i/2)-(Math.ceil(n/2)-1)/2)*20;circle(px,py,7,i%2?'#408c68':'#386c87','#275565',1);circle(px,py,2,'#e3eddf');}}else if(type<15){for(let i=0;i<type-10;i++){const px=x+(i%2-.5)*19,py=y+(Math.floor(i/2)-.5)*26;rr(px-3,py-13,6,24,3,'#468c69');line([[px-4,py],[px+4,py]],'#90b88c',2);}}else{for(let j=0;j<6;j++)ellipse(x+Math.cos(j*1.047)*12,y+Math.sin(j*1.047)*12,9,7,'#c45170',j*1.047);circle(x,y,7,'#ddb25c');}}

const AW=14,AH=20,AC=39,AX=87,AY=285,dirs=[[1,0],[-1,0],[0,1],[0,-1]];
function arrowClear(a,arrows=S.arrows){const h=a.points[a.points.length-1],d=a.dir;for(let x=h.x+d[0],y=h.y+d[1];x>=0&&x<AW&&y>=0&&y<AH;x+=d[0],y+=d[1])if(arrows.some(p=>p.id!==a.id&&!p.removed&&p.points.some(q=>q.x===x&&q.y===y)))return false;return true;}
function initArrows(){for(let attempt=0;attempt<60;attempt++){const arrows=[],occupied=new Set();for(let id=0;id<C.goal;id++){let found;for(let n=0;n<650&&!found;n++){const head={x:Math.floor(random()*AW),y:Math.floor(random()*AH)},d=pick(dirs),key=p=>p.y*AW+p.x;if(occupied.has(key(head)))continue;const probe={id,points:[head],dir:d};if(!arrowClear(probe,arrows))continue;let p={x:head.x-d[0],y:head.y-d[1]};if(p.x<0||p.x>=AW||p.y<0||p.y>=AH||occupied.has(key(p)))continue;const points=[head,p],used=new Set(points.map(key)),length=6+Math.floor(random()*9);while(points.length<length){const options=shuffle(dirs.slice()).map(v=>({x:p.x+v[0],y:p.y+v[1]})).filter(q=>q.x>=0&&q.x<AW&&q.y>=0&&q.y<AH&&!used.has(key(q))&&!occupied.has(key(q)));if(!options.length)break;p=options[0];points.push(p);used.add(key(p));}if(points.length<4)continue;found={id,points:points.reverse(),dir:d,removed:false,color:['#f2e747','#df41a5','#75cd4d','#f1a36d'][id%4]};}if(!found)break;arrows.push(found);found.points.forEach(p=>occupied.add(p.y*AW+p.x));}if(arrows.length===C.goal&&arrows.filter(a=>!arrowClear(a,arrows)).length>=3){S.arrows=arrows;S.flyArrows=[];S.flashArrow=null;return;}}throw Error('Could not generate a solvable arrow layout');}
function selectArrow(id){if(S.phase!=='play'||S.time<S.busy)return false;const a=S.arrows[id];if(!a||a.removed)return false;if(!arrowClear(a)){S.errors++;S.flashArrow={id,until:S.time+.4};S.busy=S.time+.35;feedback('BLOCKED · another arrow is ahead');burst(AX+a.points.at(-1).x*AC,AY+a.points.at(-1).y*AC,'#ed616b',5);record('collision',{id});chime('bad');if(S.errors>=3)end(false,'Three blocked arrows. Follow each arrowhead to an open edge.');return false;}a.removed=true;S.progress++;S.busy=S.time+.22;S.flyArrows.push({...a,t:0,life:.58});record('arrow-exit',{id});chime();if(S.progress===C.goal)end(true,'All arrows escaped. Good Job!');return true;}
function arrowAuto(){const a=S.arrows.filter(a=>!a.removed&&arrowClear(a)).sort((a,b)=>b.id-a.id)[0];if(a)selectArrow(a.id);else if(S.progress<C.goal)end(false,'No arrow can move. Try again.');}
function distanceSegment(x,y,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=clamp(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(x-a.x-t*dx,y-a.y-t*dy);}
function arrowHit(x,y){let best,dist=16;for(const a of S.arrows.filter(a=>!a.removed))for(let i=1;i<a.points.length;i++){const p=a.points[i-1],q=a.points[i],d=distanceSegment(x,y,{x:AX+p.x*AC,y:AY+p.y*AC},{x:AX+q.x*AC,y:AY+q.y*AC});if(d<dist){dist=d;best=a.id;}}return best;}
function drawArrow(a,motion=0){const points=a.points.map(p=>({x:AX+p.x*AC,y:AY+p.y*AC}));if(motion){const distance=motion*(a.points.length+AW+AH),trim=Math.min(points.length-1,Math.floor(distance)),head=points.at(-1),extension=(distance)*AC;points.splice(0,trim);points.push({x:head.x+a.dir[0]*extension,y:head.y+a.dir[1]*extension});}const flashing=S.flashArrow?.id===a.id&&S.flashArrow.until>S.time,offset=flashing?Math.sin(S.time*55)*5:0;ctx.save();ctx.translate(offset,0);line(points.map(p=>[p.x,p.y]),flashing?'#f35d67':a.color,6);const h=points.at(-1),d=a.dir,px=h.x-d[0]*14,py=h.y-d[1]*14;ctx.beginPath();ctx.moveTo(h.x+d[0]*5,h.y+d[1]*5);ctx.lineTo(px-d[1]*9,py+d[0]*9);ctx.lineTo(px+d[1]*9,py-d[0]*9);ctx.closePath();ctx.fillStyle=flashing?'#f35d67':a.color;ctx.fill();ctx.restore();}
function drawArrows(){ctx.fillStyle='#191b2a';ctx.fillRect(0,205,720,958);for(let y=0;y<AH;y++)for(let x=0;x<AW;x++)circle(AX+x*AC,AY+y*AC,1.5,'#a2a8b050');for(const a of S.arrows)if(!a.removed)drawArrow(a);ctx.save();ctx.beginPath();ctx.rect(10,240,700,888);ctx.clip();for(const a of S.flyArrows)drawArrow(a,clamp(a.t/a.life,0,1));ctx.restore();label('FOLLOW THE ARROWHEAD',360,1098,470,'#343543');}
function actionAt(x,y){if(S.phase!=='play'||S.time<S.busy)return false;if(C.mode==='goods'){const p=goodsHit(x,y);if(!p||S.racks[p.rack].closed)return false;if(S.selected&&S.selected.rack!==p.rack)return moveGoods(S.selected,p);if(S.racks[p.rack].slots[p.slot]!==null){S.selected=p;chime();return true;}return false;}if(C.mode==='mahjong'){const hits=S.tiles.filter(t=>!t.removed).reverse().filter(t=>{const r=mahjongRect(t);return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;});return hits[0]?mahjongSelect(hits[0].id):false;}if(C.mode==='arrows'){const id=arrowHit(x,y);return id===undefined?false:selectArrow(id);}if(C.mode==='balls'&&x>140&&x<584&&y>330&&y<459)return releasePin();const col=Math.floor((x-S.boardX)/S.cell),row=Math.floor((y-S.boardY)/S.cell);return col>=0&&col<S.cols&&row>=0&&row<S.rows?blast(row*S.cols+col):false;}

function update(dt){S.frames++;if(S.phase==='play'&&(!S.started||S.autoPaused)){ui();return;}if(S.phase!=='play'){if(S.ending>=.7)return;S.ending=Math.min(.7,S.ending+dt);}else{S.time+=dt;if(!document.hidden||qa){if(['rocks','water','balls','valves'].includes(C.mode))rescueUpdate(dt);if(S.phase==='play'&&S.time>=C.seconds)end(false,'Time is up. Try again!');if(auto&&S.phase==='play'&&S.time>=S.nextAuto&&S.time>=S.busy){autoAction();S.nextAuto=S.time+C.autoInterval;}}}for(const f of S.fx){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=450*dt;}S.fx=S.fx.filter(f=>f.t<f.life);for(const list of[S.flights,S.falling||[],S.flyArrows||[]]){for(const f of list)f.t+=dt;for(let i=list.length-1;i>=0;i--)if(list[i].t>=list[i].life)list.splice(i,1);}ui();}
function draw(){ctx.lineJoin='round';ctx.lineCap='round';ctx.clearRect(0,0,720,1280);ctx.fillStyle='#b9ceb3';ctx.fillRect(0,0,720,1280);if(C.mode==='goods')drawGoods();else if(C.mode==='mahjong')drawMahjong();else if(C.mode==='arrows')drawArrows();else drawRescue();for(const f of S.fx){ctx.globalAlpha=Math.max(0,1-f.t/f.life);circle(f.x,f.y,f.size,f.col);}ctx.globalAlpha=1;}
const jjDrawOriginal=draw;draw=function(){jjDrawOriginal();jjView.present(c=>{const a=S.signal;if(!a||S.time-a.at>1.1)return;const q=Math.min(1,(S.time-a.at)/.6),p=jjView.screen(a.from.x,a.from.y),t=jjView.screen(a.to.x,a.to.y);c.save();c.strokeStyle=a.color;c.lineWidth=3;c.globalAlpha=1-(S.time-a.at)/1.1;c.setLineDash([5,5]);c.beginPath();c.moveTo(p.x,p.y);c.quadraticCurveTo(p.x,t.y,t.x,t.y);c.stroke();c.setLineDash([]);c.fillStyle=a.color;for(let k=0;k<3;k++){const v=Math.max(0,q-k*.07),x=(1-v)*(1-v)*p.x+2*(1-v)*v*p.x+v*v*t.x,y=(1-v)*(1-v)*p.y+2*(1-v)*v*t.y+v*v*t.y;c.beginPath();c.arc(x,y,5,0,Math.PI*2);c.fill();}c.beginPath();c.arc(t.x,t.y,10+Math.sin(q*Math.PI)*7,0,Math.PI*2);c.stroke();c.restore();});};
function localPoint(e){return jjView.inverse(e);}
canvas.addEventListener('pointerdown',e=>{if(S.phase!=='play')return;S.started=true;S.autoPaused=false;e.preventDefault();const p=localPoint(e);pointer={...p,id:e.pointerId,moved:false};canvas.setPointerCapture(e.pointerId);if(C.mode==='goods'){const from=goodsHit(p.x,p.y);if(from&&!S.racks[from.rack].closed&&S.racks[from.rack].slots[from.slot]!==null)pointer.from=from;}});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=localPoint(e);if(Math.hypot(p.x-pointer.x,p.y-pointer.y)>12)pointer.moved=true;if(pointer.moved&&pointer.from){const f=pointer.from;S.drag={...f,type:S.racks[f.rack].slots[f.slot],...p};draw();}});
canvas.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;auto=false;const p=localPoint(e),from=pointer.from;if(pointer.moved&&from)moveGoods(from,goodsHit(p.x,p.y));else actionAt(p.x,p.y);S.drag=null;pointer=null;ui();draw();});canvas.addEventListener('pointercancel',()=>{S.drag=null;pointer=null;draw();});
$('auto').addEventListener('click',()=>{if(S.phase!=='play')return;auto=!auto;S.started=true;S.autoPaused=!auto;S.drag=null;pointer=null;S.nextAuto=S.time+.15;ui();});for(const id of['retry','resultRetry'])$(id).addEventListener('click',()=>reset());$('shuffle').addEventListener('click',mahjongShuffle);
function resize(){stage.style.setProperty('--u',stage.getBoundingClientRect().width/720+'px');}window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>last=performance.now());
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(!document.hidden){update(dt);draw();}requestAnimationFrame(frame);}
function state(){const common={started:S.started,paused:S.autoPaused,id:C.id,mode:C.mode,phase:S.phase,time:+S.time.toFixed(3),ending:S.ending,auto,progress:S.progress,goal:C.goal,moves:S.moves,errors:S.errors,seed:S.seed,actions:S.actions,frames:S.frames};if(C.mode==='goods')return{...common,racks:S.racks,selected:S.selected,conserved:S.racks.reduce((n,r)=>n+r.slots.filter(t=>t!==null).length,0)+S.progress*3===48};if(C.mode==='mahjong')return{...common,tiles:S.tiles.map(t=>({...t,free:tileFree(t),rect:mahjongRect(t)})),availablePairs:availablePairs(),shuffles:S.shuffles,conserved:S.tiles.filter(t=>!t.removed).length+S.progress*2===68};if(C.mode==='arrows')return{...common,arrows:S.arrows.map(a=>({...a,free:arrowClear(a)})),conserved:S.arrows.filter(a=>!a.removed).length+S.progress===C.goal};return{...common,board:S.board,cols:S.cols,rows:S.rows,cell:S.cell,boardX:S.boardX,boardY:S.boardY,groups:tileGroups(),water:S.water,plates:S.plates,fire:S.fire,charge:S.charge,releases:S.releases,room:S.room,yellow:S.yellow,yellowTarget:S.yellowTarget,red:S.red,conserved:S.board.filter(t=>t!==null).length+S.removed+S.discardedTiles===S.generatedTiles};}
window.__sevenPlayable={state};if(qa)Object.assign(window.__sevenPlayable,{reset,advance(seconds){for(let i=0;i<Math.ceil(seconds*60);i++)update(Math.min(1/60,seconds-i/60));draw();return state();},setAuto(v){auto=v;S.started=true;S.autoPaused=!v;S.nextAuto=S.time+.15;ui();},act:actionAt,moveGoods,selectArrow,selectTile:mahjongSelect,shuffle:mahjongShuffle,releasePin,autoAction,coordinates:{slotPoint,tilePoint,mahjongRect,arrowGrid:{x:AX,y:AY,cell:AC}},solution:()=>S.solution});
resize();reset(C.seed);requestAnimationFrame(frame);
})();

</script>
