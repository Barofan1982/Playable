function bounds(){if(!active&&!settling)return;const host=document.querySelector(config.hostSelector),r=host?.getBoundingClientRect();if(!r)return;Object.assign(overlay.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});}
function mediaUrl(){if(clipUrl)return clipUrl;const binary=atob(clipData),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return clipUrl=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));}
function notVisible(){return document.hidden||hiddenAd;}
function finish(){ended=true;resumeVideo=false;video.pause();still.hidden=false;video.hidden=true;overlay.dataset.phase='held';}
async function playClip(){if(!active||kind==='failure'||notVisible())return;try{await video.play();if(active&&!ended&&!notVisible()){still.hidden=true;video.hidden=false;overlay.dataset.phase='playing';}else{if(active&&!ended&&notVisible())resumeVideo=true;video.pause();}}catch{finish();}}
function present(value='success'){if(active)return false;settling=false;clearInterval(settleTimer);active=true;kind=value==='failure'?'failure':'success';ended=false;showCount++;still.src=poster;overlay.hidden=false;overlay.style.background='#174b4c';overlay.dataset.kind=kind;overlay.dataset.phase=kind==='failure'?'failure':'loading';still.hidden=false;video.hidden=kind==='failure';failure.hidden=kind!=='failure';bounds();stopEngines();for(const selector of ['#result','#status','#paused']){const node=document.querySelector(selector);if(node)node.style.display='none';}if(auto){auto.disabled=true;auto.textContent='AUTO PLAY';}if(kind==='success'){video.src=mediaUrl();video.load();resumeVideo=notVisible();if(!resumeVideo)playClip();}else ended=true;document.dispatchEvent(new CustomEvent('jj:result',{detail:{id:config.id,kind}}));return true;}
function animating(){for(const w of engineWindows())try{const C=w.cc,scene=C?.director?.getScene?.();if(!scene)continue;const nodes=[scene];while(nodes.length){const n=nodes.pop();nodes.push(...n.children||[]);if(!n.activeInHierarchy)continue;for(const c of n.components||n._components||[]){if(!/Skeleton$/.test(C.js.getClassName(c)))continue;const t=c.getCurrent?.(0);let visible=true;for(let p=n;p;p=p.parent)if(p.opacity===0)visible=false;if(visible&&t&&!t.loop&&t.trackTime+.08<(t.animationEnd||t.animation?.duration||0))return true;}}}catch{}return false;}
function show(value='success'){if(active||settling)return false;settling=true;kind=value==='failure'?'failure':'success';settleElapsed=0;settleLast=performance.now();overlay.hidden=false;overlay.style.background='transparent';overlay.dataset.phase='settling';still.hidden=true;video.hidden=true;failure.hidden=true;bounds();if(auto){wasAutoDisabled=auto.disabled;auto.disabled=true;auto.textContent='AUTO PLAY';}document.dispatchEvent(new CustomEvent('jj:settlement',{detail:{id:config.id,kind}}));settleTimer=setInterval(()=>{const now=performance.now(),delta=now-settleLast;settleLast=now;if(notVisible())return;settleElapsed+=Math.min(delta,250);if(settleElapsed>=2600&&(!animating()||settleElapsed>=7000))present(kind);},100);return true;}
function hide(){clearInterval(settleTimer);settling=false;settleElapsed=0;active=false;kind=null;ended=false;resumeVideo=false;video.pause();overlay.hidden=true;failure.hidden=true;if(auto)auto.disabled=wasAutoDisabled;}
video.addEventListener('playing',()=>{if(!active||notVisible())video.pause();else{still.hidden=true;video.hidden=false;}});video.addEventListener('ended',finish);video.addEventListener('error',()=>{if(active&&kind==='success')finish();});
function syncVisibility(){if(!active)return;stopEngines();if(notVisible()){resumeVideo=resumeVideo||(kind==='success'&&!ended&&!video.paused);video.pause();}else if((resumeVideo||(!ended&&video.currentTime===0))&&kind==='success'){resumeVideo=false;playClip();}}
document.addEventListener('visibilitychange',syncVisibility);window.addEventListener('pagehide',()=>{hiddenAd=true;syncVisibility()});window.addEventListener('pageshow',()=>{hiddenAd=false;syncVisibility()});
const ad=window.mraid;if(ad?.addEventListener){ad.addEventListener('viewableChange',value=>{hiddenAd=!value;syncVisibility()});ad.addEventListener('stateChange',value=>{hiddenAd=value==='hidden';syncVisibility()});}
window.addEventListener('resize',bounds);const host=document.querySelector(config.hostSelector);if(host&&typeof ResizeObserver!=='undefined')new ResizeObserver(bounds).observe(host);
document.querySelector(config.retrySelector||'#retry')?.addEventListener('click',()=>{video.pause();},{capture:true});
window.__JJEndcard={show,hide,state:()=>({active,settling,settleElapsed,kind,ended,playing:active&&!video.paused,paused:video.paused,currentTime:video.currentTime,duration:video.duration||0,muted:video.muted,hidden:notVisible(),showCount,frame:{x:overlay.getBoundingClientRect().x,y:overlay.getBoundingClientRect().y,width:overlay.getBoundingClientRect().width,height:overlay.getBoundingClientRect().height},videoBytes:config.videoBytes})};
})();
