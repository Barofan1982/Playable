  $('pairProgress').replaceChildren();current().pairs.forEach((p,id)=>{const pip=document.createElement('span');pip.className='pip'+(paths[id]?' linked':'');pip.style.setProperty('--pair',colors[id]);$('pairProgress').append(pip);});

  $('next').hidden=phase!=='won'||levelIndex===LEVELS.length-1;$('next').style.gridColumn='1 / -1';
  $('auto').textContent=autoOn?'Ⅱ PAUSE':autoPaused?'▶ RESUME':'▶ AUTO PLAY';

 function reset(index=levelIndex,keepAuto=false){
  levelIndex=index;paths=Array(current().pairs.length).fill(null);active=null;history=[];chances=3;phase='playing';autoStep=0;autoPoint=0;autoDelay=0;hint=null;flash=null;confetti=[];

  $('boardWrap').classList.remove('error');void $('boardWrap').offsetWidth;$('boardWrap').classList.add('error');effects('error');

 function finish(){
  if(!active)return false;const a=active,goal=current().pairs[a.id].ends[1-a.startEnd],tail=a.points[a.points.length-1];

 function stroke(point){

 function toggleAuto(){

  if(autoPaused){autoOn=true;autoPaused=false;status('Finding a clear route…');refresh();return;}
  const needsRedraw=count()>0||active||phase!=='playing';reset();autoOn=true;autoPaused=false;
  status(needsRedraw?'Auto is redrawing this puzzle.':'Watch the route unfold.','Draws each line with the same collision rules.');refresh();
 }
 function update(dt){
  clock+=dt;
  for(const p of confetti){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}confetti=confetti.filter(p=>p.life>0);
  if(flash&&clock>flash.until)flash=null;if(hint&&clock>hint.until)hint=null;
  if(!autoOn)return;
  if(phase==='won'){
   autoDelay-=dt;if(autoDelay>0)return;
   if(levelIndex===LEVELS.length-1){autoOn=false;refresh();return;}
   reset(levelIndex+1,true);status('Watch the route unfold.');return;
  }
  if(phase!=='playing'){autoOn=false;refresh();return;}
  if(autoDelay>0){autoDelay-=dt;return;}

  while(remaining>0&&active){
   const at=active.points[active.points.length-1],target=route[Math.min(autoPoint+1,route.length-1)],d=R.distance(at,target);

  }

 function line(points,color,width=14,alpha=1,dashed=false){
  if(!points||points.length<2)return;ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();points.forEach((p,i)=>{if(i)ctx.lineTo(p[0]*600,p[1]*600);else ctx.moveTo(p[0]*600,p[1]*600);});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';if(dashed)ctx.setLineDash([8,9]);ctx.stroke();ctx.restore();

 function draw(){
  const scale=canvas.width/600;ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,600,600);
