function sound(kind){if(!gesture||!window.__journeyAudio.canPlayEffects())return;try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();window.__journeyAudio.registerContext(audio,{independent:true});}audio.resume();const now=audio.currentTime;const tone=(frequency,duration,delay=0,type='sine',volume=.08)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(frequency,now+delay);o.frequency.exponentialRampToValueAtTime(frequency*.85,now+delay+duration);g.gain.setValueAtTime(.001,now+delay);g.gain.exponentialRampToValueAtTime(volume,now+delay+.015);g.gain.exponentialRampToValueAtTime(.001,now+delay+duration);o.connect(g);g.connect(audio.destination);o.start(now+delay);o.stop(now+delay+duration+.02);};
 if(kind==='served'){tone(660,.16);tone(880,.23,.12);tone(1100,.25,.24);}else if(kind==='mistake'){tone(185,.18,0,'triangle',.06);tone(135,.18,.16,'triangle',.05);}else if(kind==='lift')tone(520,.09,0,'sine',.06);else if(kind==='sauce'){tone(290,.12,0,'triangle',.04);tone(430,.06,.05,'sine',.04);}else if(kind==='load'){const buffer=audio.createBuffer(1,audio.sampleRate*.24,audio.sampleRate),v=buffer.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=(Math.random()*2-1)*Math.pow(1-i/v.length,2);const src=audio.createBufferSource(),g=audio.createGain(),filter=audio.createBiquadFilter();src.buffer=buffer;filter.type='highpass';filter.frequency.value=1700;g.gain.value=.032;src.connect(filter);filter.connect(g);g.connect(audio.destination);src.start();}
 }catch{}}
function consumeEvents(){for(const e of s.events){if(e.id<=lastEvent)continue;lastEvent=e.id;sound(e.kind);if(e.kind==='lift')animations.push({...e,age:0});if(e.kind==='sauce')animations.push({...e,age:0});if(e.kind==='served'){s.lastMessage=null;for(let i=0;i<20;i++)particles.push({x:195,y:304,vx:(Math.random()-.5)*170,vy:-70-Math.random()*110,age:0});}}}
function drawAnimations(dt){for(const a of animations){a.age+=dt;if(a.kind==='lift'){const u=Math.min(1,a.age/.42),v=1-(1-u)**3;const x=XS[a.grill]+(XS[a.plate]-XS[a.grill])*v,y=GY+(PY-5-GY)*v-Math.sin(u*Math.PI)*47;steak(x,y,94-(94-79)*v,a.cook);}if(a.kind==='sauce'){const u=Math.min(1,a.age/.62);if(u<.72){const v=Math.sin(u/.72*Math.PI);ketchup(XS[a.plate]+31, PY-58-v*12,.66,true,-.8);line(XS[a.plate]+13,PY-49,XS[a.plate],PY-4,'#d44833',3);}}}animations=animations.filter(a=>a.age<(a.kind==='lift'?.43:.65));for(const p of particles){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;ctx.save();ctx.globalAlpha=Math.max(0,1-p.age/1.15);star(p.x,p.y,5,'#ffdf69');ctx.restore();}particles=particles.filter(p=>p.age<1.15);}
function reset(){s=R.create();sauceSelected=false;animations=[];particles=[];lastEvent=0;sync();}
function sync(){autoButton.textContent=s.auto?(s.paused?'▶ CONTINUE':'Ⅱ PAUSE'):'▶ AUTO PLAY';autoButton.setAttribute('aria-label',s.auto?(s.paused?'Continue automatic play':'Pause automatic play'):'Start automatic play');}
function manual(type,i){gesture=true;if(s.auto){s.auto=false;s.paused=false;}R.act(s,type,i);consumeEvents();sync();}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;gesture=true;if(s.phase==='won'||s.phase==='lost')return;
 if(y>641&&y<742&&x<150){sauceSelected=false;manual('load',0);return;}
 if(x>271&&x<368&&y>622&&y<752){s.auto=false;s.paused=false;sauceSelected=!sauceSelected;sound('lift');sync();return;}
 if(x>155&&x<250&&y>641&&y<744){sauceSelected=false;manual('serve',0);return;}
 if(y>392&&y<501){const i=XS.findIndex(v=>Math.abs(x-v)<56);if(i>=0){sauceSelected=false;manual('lift',i);}return;}
 if(y>541&&y<624){const i=XS.findIndex(v=>Math.abs(x-v)<57);if(i>=0&&sauceSelected)manual('sauce',i);}
});
autoButton.addEventListener('click',()=>{gesture=true;sauceSelected=false;R.toggleAuto(s);sync();});retryButton.addEventListener('click',()=>{gesture=true;reset();sound('lift');});
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden)audio?.suspend();else if(gesture)audio?.resume();});
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden){R.step(s,dt);consumeEvents();ctx.clearRect(0,0,W,H);background(s.time);orderPanel();grill(s.time);counter(now/1000);drawAnimations(s.paused?0:dt);feedback();ending();sync();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.__qa={state:()=>JSON.parse(JSON.stringify(s)),startAuto:()=>{if(!s.auto)R.toggleAuto(s);else s.paused=false;sync();},toggleAuto:()=>{R.toggleAuto(s);sync();},reset,act:(type,i)=>{R.act(s,type,i);consumeEvents();sync();},fail:()=>{s.phase='lost';s.auto=false;sync();},simulate:(seconds=90)=>{for(let i=0;i<seconds*60;i++)R.step(s,1/60);consumeEvents();sync();return s.phase;},locations:{raw:{x:80,y:693},grills:XS.map(x=>({x,y:GY})),plates:XS.map(x=>({x,y:PY})),sauce:{x:317,y:689},serve:{x:202,y:696}}};
})();
