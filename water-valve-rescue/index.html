function arrowShape(a,motion=0){const original=a.points.map(p=>({x:AX+p.x*AC,y:AY+p.y*AC}));if(!motion)return original;const length=(original.length-1)*AC,head=original.at(-1),travel=a.travel||arrowTravel(a),q=clamp(motion,0,1),shift=travel*q*q*(3-2*q),full=[...original,{x:head.x+a.dir[0]*travel,y:head.y+a.dir[1]*travel}],at=d=>{if(d<=length){const i=Math.min(original.length-2,Math.floor(d/AC)),f=(d-i*AC)/AC;return{x:mix(original[i].x,original[i+1].x,f),y:mix(original[i].y,original[i+1].y,f)};}return{x:head.x+a.dir[0]*(d-length),y:head.y+a.dir[1]*(d-length)};},result=[at(shift)];for(let i=1;i<full.length-1;i++){const d=i*AC;if(d>shift&&d<shift+length)result.push(full[i]);}result.push(at(shift+length));return result;}
function roundedArrowLine(points,color){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length-1;i++){const a=points[i-1],p=points[i],b=points[i+1],da=Math.hypot(p.x-a.x,p.y-a.y),db=Math.hypot(b.x-p.x,b.y-p.y),r=Math.min(AC*.20,da/2,db/2);if(!r)continue;ctx.lineTo(p.x+(a.x-p.x)*r/da,p.y+(a.y-p.y)*r/da);ctx.quadraticCurveTo(p.x,p.y,p.x+(b.x-p.x)*r/db,p.y+(b.y-p.y)*r/db);}const h=points.at(-1);ctx.lineTo(h.x,h.y);ctx.strokeStyle=color;ctx.lineWidth=6;ctx.stroke();}

function drawArrows(){ctx.fillStyle='#191b2a';ctx.fillRect(0,205,720,958);rr(69,248,584,828,15,'#1c1e30','#393b50',2);for(let y=0;y<AH;y++)for(let x=0;x<AW;x++)circle(AX+x*AC,AY+y*AC,1.3,'#a2a8b035');ctx.save();ctx.beginPath();ctx.rect(10,240,700,848);ctx.clip();for(const a of S.arrows)if(!a.removed)drawArrow(a);for(const a of S.flyArrows)drawArrow(a,clamp(a.t/a.life,0,1));ctx.restore();label('FOLLOW THE ARROWHEAD',360,1101,470,'#343543');}

function actionAt(x,y){if(S.phase!=='play'||S.time<S.busy)return false;if(C.mode==='goods'){const p=goodsHit(x,y);if(!p||S.racks[p.rack].closed)return false;if(S.selected&&S.selected.rack!==p.rack)return moveGoods(S.selected,p);if(S.racks[p.rack].slots[p.slot]!==null){S.selected=p;chime();return true;}return false;}if(C.mode==='mahjong'){const hits=S.tiles.filter(t=>!t.removed).reverse().filter(t=>{const r=mahjongRect(t);return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;});return hits[0]?mahjongSelect(hits[0].id):false;}if(C.mode==='arrows'){const id=arrowHit(x,y);return id===undefined?false:selectArrow(id);}if(C.mode==='balls'&&x>140&&x<584&&y>330&&y<459)return releasePin();const col=Math.floor((x-S.boardX)/S.cell),row=Math.floor((y-S.boardY)/S.cell);return col>=0&&col<S.cols&&row>=0&&row<S.rows?blast(row*S.cols+col):false;}

function localPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.x)*720/r.width,y:(e.clientY-r.y)*1280/r.height};}
canvas.addEventListener('pointerdown',e=>{if(S.phase!=='play')return;e.preventDefault();const p=localPoint(e);pointer={...p,id:e.pointerId,moved:false};canvas.setPointerCapture(e.pointerId);if(C.mode==='goods'){const from=goodsHit(p.x,p.y);if(from&&!S.racks[from.rack].closed&&S.racks[from.rack].slots[from.slot]!==null)pointer.from=from;}});
canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=localPoint(e);if(Math.hypot(p.x-pointer.x,p.y-pointer.y)>12)pointer.moved=true;if(pointer.moved&&pointer.from){const f=pointer.from;S.drag={...f,type:S.racks[f.rack].slots[f.slot],...p};draw();}});
