function initSound(){usedSound=true;try{if(!soundContext)soundContext=new(window.AudioContext||window.webkitAudioContext)();if(soundContext.state==='suspended'&&!hidden&&!paused)soundContext.resume();}catch(e){}}

function pos(i){return{x:BOARD.x+(i%7)*BOARD.cell,y:BOARD.y+Math.floor(i/7)*BOARD.cell};}
function hit(x,y){const c=Math.floor((x-BOARD.x)/BOARD.cell),r=Math.floor((y-BOARD.y)/BOARD.cell);return c>=0&&c<7&&r>=0&&r<7?r*7+c:-1;}
function finish(ok){state.status=ok?'success':'failed';state.auto=false;state.busyUntil=0;state.flights=[];paused=false;sound(ok?'win':'wrong');sync();}
function tap(index){index=Number(index);if(!ready||state.status!=='playing'||paused||hidden||clock<state.busyUntil||index<0||index>=49||!state.board[index])return false;const k=state.board[index];state.moves++;if(k!==TARGETS[state.targetIndex]){state.lives--;redFlash=clock+350;state.hintUntil=clock+1800;sound('wrong');if(!state.lives)finish(false);return false;}state.board[index]=null;state.cleared.push(index);state.collected++;const p=pos(index);state.flights.push({k,x:p.x+42,y:p.y+42,start:clock,end:clock+480});state.busyUntil=clock+520;sound();if(state.collected===3){state.transitionAt=clock+1050;state.busyUntil=clock+1150;}return true;}
function startAuto(){initSound();if(state.status!=='playing')reset();state.auto=true;paused=false;state.autoAt=clock+600;sync();return snapshot();}
function choose(){const preferred=AUTO_ORDER[state.targetIndex]||[];return preferred.find(i=>state.board[i]===TARGETS[state.targetIndex])??state.board.findIndex(k=>k===TARGETS[state.targetIndex]);}
function tick(dt){if(hidden||paused||!ready)return;clock+=dt;state.elapsed+=dt;for(const f of state.flights)if(clock>=f.end&&!f.arrived){f.arrived=true;state.filled++;}state.flights=state.flights.filter(f=>clock<f.end);if(state.transitionAt&&clock>=state.transitionAt){state.completed++;state.transitionAt=0;state.collected=0;state.filled=0;state.targetIndex++;if(state.targetIndex===TARGETS.length){finish(true);return;}state.hintUntil=clock+1300;}if(state.status==='playing'&&state.auto&&clock>=state.autoAt&&clock>=state.busyUntil){const i=choose();if(i>=0)tap(i);else finish(false);state.autoAt=clock+720;}}
function drawTarget(){const k=TARGETS[state.targetIndex]||TARGETS[5],img=imgs.targets[k]||imgs.sprites[k],x=197,y=73,w=334,h=344;if(!img)return;const p=state.status==='success'?1:state.filled/3,o=outlines[k],sc=Math.min(w/img.width,h/img.height);ctx.save();if(p>0){ctx.shadowColor=k==='grape'?'#a558ff':'#ffd54c';ctx.shadowBlur=24+p*20;}if(o)ctx.drawImage(o,x+(w-img.width*sc)/2-6*sc,y+(h-img.height*sc)/2-6*sc,o.width*sc,o.height*sc);ctx.shadowBlur=0;ctx.save();ctx.beginPath();ctx.rect(x-8,y+h*(1-p),w+16,h*p+8);ctx.clip();imageFit(img,x,y,w,h);ctx.restore();if(p===1){ctx.globalAlpha=.14;ctx.fillStyle='#fff2aa';ctx.beginPath();ctx.ellipse(360,255,188,182,0,0,Math.PI*2);ctx.fill();}ctx.restore();text(LABEL[k]+'  '+Math.min(3,state.filled)+'/3',360,439,28,'#fff8df');}
function draw(){ctx.clearRect(0,0,W,H);if(imgs.background)ctx.drawImage(imgs.background,0,0,W,H);else{ctx.fillStyle='#8aabac';ctx.fillRect(0,0,W,H);}ctx.fillStyle='#1c271321';ctx.fillRect(0,0,W,H);if(!ready){text('Loading fruit tiles',360,630,32);return;}drawTarget();ctx.save();ctx.shadowColor='#162827af';ctx.shadowBlur=16;ctx.shadowOffsetY=12;round(BOARD.x-13,BOARD.y-15,BOARD.cell*7+26,BOARD.cell*7+27,31);ctx.fillStyle='#265875';ctx.fill();ctx.shadowColor='transparent';ctx.strokeStyle='#6693a4';ctx.lineWidth=4;ctx.stroke();ctx.restore();for(let i=0;i<49;i++){const p=pos(i);tile(state.board[i]||LOWER[i],p.x,p.y,85,!state.board[i]);if(!state.board[i]){ctx.fillStyle='#181b1266';round(p.x,p.y,85,81,15);ctx.fill();}}
for(const f of state.flights){const t=Math.max(0,Math.min(1,(clock-f.start)/(f.end-f.start))),e=1-(1-t)**3;tile(f.k,f.x+(360-f.x)*e-37*(1-t*.6),f.y+(280-f.y)*e-37*(1-t*.6)-Math.sin(t*Math.PI)*90,74*(1-t*.6));}
text(state.status==='playing'?(state.hintUntil>clock?'Tap '+LABEL[TARGETS[state.targetIndex]]+' to add color':'Collect 3 of the target fruit'):state.status==='success'?'All six fruits complete':'Pick the fruit shown above',360,1153,26,'#fff7e5');text('Completed '+state.completed+'/6',170,1208,25,'#ffefd4');text('Chances '+state.lives+'/3',547,1208,25,'#ffefd4');if(redFlash>clock){ctx.fillStyle='#f3463140';ctx.fillRect(0,0,W,H);}if(paused||state.status!=='playing'){ctx.fillStyle='#132b3877';ctx.fillRect(0,0,W,H);ctx.save();ctx.shadowColor='#0005';ctx.shadowBlur=18;round(83,435,554,330,35);ctx.fillStyle='#fff6df';ctx.fill();ctx.shadowBlur=0;text(paused?'Paused':state.status==='success'?'Fruit complete!':'Try again',360,525,45,paused?'#284e65':state.status==='success'?'#578726':'#c76330');text(paused?'Tap Continue to resume':state.status==='success'?'18 picks. Six fruits.':'Tap the target fruit',360,606,27,'#31505f');text(paused?'Auto play is paused':'Tap Retry to start again',360,674,25,'#31505f');ctx.restore();}}
function step(ms=16){let left=Math.max(0,Math.min(Number(ms)||0,30000));while(left>0){const d=Math.min(50,left);tick(d);left-=d;}draw();return snapshot();}
function animate(t){const dt=last?Math.min(50,t-last):0;last=t;tick(dt);draw();requestAnimationFrame(animate);}
function pointer(e){if(state.auto||paused||hidden)return;initSound();const r=canvas.getBoundingClientRect(),scale=Math.min(r.width/W,r.height/H),ox=(r.width-W*scale)/2,oy=(r.height-H*scale)/2;tap(hit((e.clientX-r.left-ox)/scale,(e.clientY-r.top-oy)/scale));}
canvas.addEventListener('pointerdown',pointer);autoBtn.onclick=startAuto;pauseBtn.onclick=()=>{paused=!paused;if(soundContext){if(paused)soundContext.suspend();else if(!hidden)soundContext.resume();}sync();};retryBtn.onclick=()=>{initSound();reset();};document.addEventListener('visibilitychange',()=>{hidden=document.hidden;last=0;if(soundContext){if(hidden)soundContext.suspend();else if(!paused)soundContext.resume();}});window.addEventListener('pagehide',()=>{hidden=true;if(soundContext)soundContext.suspend();});window.addEventListener('pageshow',()=>{hidden=document.hidden;last=0;});
let ready=false;
function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});}
async function load(){imgs.background=ASSETS.background?await loadImage(ASSETS.background):null;for(const group of ['sprites','tiles','targets'])for(const [k,v] of Object.entries(ASSETS[group]||{}))imgs[group][k]=await loadImage(v);for(const k of TARGETS){const im=imgs.targets[k]||imgs.sprites[k];if(!im)continue;const o=document.createElement('canvas'),inner=document.createElement('canvas');o.width=inner.width=im.width+12;o.height=inner.height=im.height+12;const c=o.getContext('2d'),ic=inner.getContext('2d');c.drawImage(im,6,6);c.globalCompositeOperation='source-in';c.fillStyle='#241e12';c.fillRect(0,0,o.width,o.height);ic.drawImage(im,6,6);ic.globalCompositeOperation='destination-in';for(const [dx,dy] of [[-5,0],[5,0],[0,-5],[0,5],[-4,-4],[4,4],[-4,4],[4,-4]])ic.drawImage(im,6+dx,6+dy);c.globalCompositeOperation='destination-out';c.drawImage(inner,0,0);outlines[k]=o;}ready=true;}
let adHidden=false;function adVisibility(visible){adHidden=!visible;hidden=document.hidden||adHidden;last=0;if(soundContext){if(hidden)soundContext.suspend();else if(!paused)soundContext.resume();}}try{if(window.mraid&&typeof window.mraid.addEventListener==='function'){window.mraid.addEventListener('viewableChange',adVisibility);if(typeof window.mraid.isViewable==='function')adVisibility(window.mraid.isViewable());}}catch(e){}document.addEventListener('visibilitychange',()=>{if(adHidden)adVisibility(false);});window.addEventListener('pageshow',()=>{if(adHidden)adVisibility(false);});
window.__QA={state:snapshot,startAuto,reset,tap,solve:choose,step,fail:()=>{finish(false);draw();return snapshot();},hooks:{hide:()=>{hidden=true;},show:()=>{hidden=false;last=0;},adVisibility,pause:()=>{paused=true;sync();},resume:()=>{paused=false;sync();},hit,pos}};
