  if(pointer){const rect=canvas.getBoundingClientRect(),scale=720/rect.width,x=pointer.ox*scale,y=pointer.oy*size.height/rect.height,dx=(pointer.x-pointer.ox)*scale,dy=(pointer.y-pointer.oy)*size.height/rect.height,n=Math.hypot(dx,dy),limit=74;ctx.beginPath();ctx.arc(x,y,82,0,Math.PI*2);ctx.fillStyle='#ffffff35';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#ffffff99';ctx.stroke();ctx.beginPath();ctx.arc(x+dx/Math.max(1,n/limit),y+dy/Math.max(1,n/limit),30,0,Math.PI*2);ctx.fillStyle='#ffffffcc';ctx.fill();}
  if(s.phase==='won'){for(let i=0;i<70;i++){const x=(i*137.3+s.time*12)%720,y=(i*69.9+(s.time-20)*38)%size.height;ctx.fillStyle=['#ffe47a','#fff4c9','#22d1b0','#fb85ac'][i%4];ctx.fillRect(x,y,6,13);}}
 }
 let uiAt=0;
 function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;renderer.syncView();if(!document.hidden&&!paused&&window.__journeyAudio.canPlayEffects()){
   const before=s.phase;R.step(s,dt,input(),auto);for(const a of s.actors){const distance=s.phase==='play'?(a.walking||0):0;advanceSeraWalk(a,dt,distance);if(a.load>0)a.rollAngle=(a.rollAngle||0)+distance*R.ROLL_SCALE/(.38+Math.cbrt(a.load/36)*.87);}
   for(const e of s.events){if(e.time<=lastEvent)continue;if(e.actor===0){if(e.kind==='pick')flights.push(e);if(e.kind==='pick'||e.kind==='lay')sound(e.kind);}}lastEvent=s.time;flights=flights.filter(f=>s.time-f.time<.36);
   if(before==='play'&&s.phase!=='play'){sound(s.phase==='won'?'finish':'lost');ui();}
  }else for(const a of s.actors)a.walking=0;
  const p=s.actors[0];renderer.updateCamera(p.x,p.z,dt,p.height);renderer.draw(buildScene());paintOverlay();if(now-uiAt>120){ui();uiAt=now;}$('toast').hidden=s.time>=toastUntil;frames++;requestAnimationFrame(frame);
 }
 function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
 canvas.addEventListener('pointerdown',e=>{if(s.phase==='won'||s.phase==='lost')return;wake();const q=point(e);pointer={id:e.pointerId,ox:q.x,oy:q.y,...q};canvas.setPointerCapture(e.pointerId);sound('pick');});
 canvas.addEventListener('pointermove',e=>{if(pointer?.id===e.pointerId)Object.assign(pointer,point(e));});
 for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>{pointer=null;});
 window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){e.preventDefault();if(s.phase==='won'||s.phase==='lost')return;wake();keys.add(e.key);}});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>{pointer=null;keys.clear();});
 $('auto').onclick=()=>{if(s.phase==='won'||s.phase==='lost')return;if(auto){auto=false;paused=true;}else{start();auto=true;autoSession=true;pointer=null;keys.clear();}ui();};$('retry').onclick=reset;$('resultRetry').onclick=reset;
 document.addEventListener('visibilitychange',()=>{pointer=null;keys.clear();last=performance.now();});
 window.__bridge={state:()=>({phase:s.phase,paused,auto,seed:s.seed,time:s.time,actors:s.actors.map(a=>({...a})),placed:s.placed,collected:s.collected,frames,winner:s.winner}),reset,screen:(x,z,y=0)=>project([x,y,z])};
 if(new URLSearchParams(location.search).has('qa'))Object.assign(window.__bridge,{simulate:(seed=1)=>{const t=R.init(seed);t.phase='play';for(let i=0;i<10000&&t.phase==='play';i++)R.step(t,.016,{x:0,z:0},true);return{phase:t.phase,time:t.time,spent:t.actors[0].spent,collected:t.actors[0].collected,load:t.actors[0].load,placed:t.placed};},fail:()=>{s.phase='lost';s.reason='You slipped off the bridge.';ui();},teleport:(x,z,level=0,load=0)=>{const p=s.actors[0];Object.assign(p,{x,z,level,load});s.phase='play';}});
 reset();requestAnimationFrame(frame);
})();
