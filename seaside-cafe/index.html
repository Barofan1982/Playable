 cashPile(s,C.bank,bankCash);for(const g of guests){character(s,g);if(C.theme==='flower'&&g.state==='leaving')for(let j=0;j<g.initial;j++)item(s,1,g.x+(j%2-.5)*.20,g.y+.75+Math.floor(j/2)*.22,g.z+.25,.52,g.yaw);}for(const w of workers)if(hired(w))character(s,w);character(s,player,true);
 for(const f of flights){const t=clamp(f.t/f.duration,0,1),actor=f.actor===0?player:workers.find(w=>w.id===f.actor),b=actor?{x:actor.x,y:actor.y+1,z:actor.z}:f.b,x=lerp(f.a.x,b.x,t),y=lerp(f.a.y,b.y,t)+Math.sin(t*Math.PI)*.38,z=lerp(f.a.z,b.z,t);if(f.kind==='cash'){if(C.currency==='coin')coin(s,x,y,z,1,t*4);else bill(s,x,y,z,t*3,.85);}else item(s,f.type,x,y,z,.78,t*.8);}

function label(text,x,y,z,color='#fff7de',size=15,bg='#4c7361e8'){const p=project([x,y,z]);if(p.x<20||p.x>700||p.y<(jjWide()?12:180)||p.y>renderer.size().height-(jjWide()?60:155))return;ctx.font='900 '+size+'px Arial';const w=ctx.measureText(text).width+18;ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(p.x-w/2,p.y-12,w,25,8);ctx.fill();ctx.fillStyle=color;ctx.textAlign='center';ctx.fillText(text,p.x,p.y+5);}
function jjWide(){return innerWidth>=600&&innerWidth>innerHeight;}
function overlay(){const ratio=canvas.getBoundingClientRect().height/canvas.getBoundingClientRect().width,h=720*ratio;effects.width=720;effects.height=Math.round(h);ctx.clearRect(0,0,720,h);const u=nextUpgrade();

function draw(){renderer.syncView();const s=scene();if(qa){stats.invalidModels+=s.filter(o=>Array.from(o.model).some(v=>!Number.isFinite(v))).length;}renderer.draw(s);overlay();frameCount++;}
function frame(t){const dt=clamp((t-last)/1000,0,.05);last=t;if(!document.hidden&&phase!=='complete'){update(dt);renderer.setOverview(phase==='celebrate'?clamp((elapsed-(finishAt-1.8))/1.8,0,1):0);renderer.updateCamera(player.x,player.z,dt,player.y);draw();}requestAnimationFrame(frame);}
const pointerPoint=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*720/r.width,y:(e.clientY-r.top)*720/r.width};};
canvas.addEventListener('pointerdown',e=>{if(phase!=='play')return;e.preventDefault();const p=pointerPoint(e);pointer={...p,startX:p.x,startY:p.y,moved:false,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=pointerPoint(e);Object.assign(pointer,p);if(Math.hypot(p.x-pointer.startX,p.y-pointer.startY)>8){pointer.moved=true;auto=false;pendingPurchase=null;}});

document.getElementById('auto').addEventListener('click',()=>{if(phase!=='play')return;auto=!auto;pendingPurchase=null;clickTarget=null;player.targetKey=null;player.path=[];updateGuide();updateUI();});document.getElementById('retry').addEventListener('click',reset);
const panel=document.getElementById('teamPanel');document.getElementById('team').addEventListener('click',()=>{const hud=document.getElementById('hud'),bottom=document.getElementById('bottom');panel.style.top=(hud.offsetTop+hud.offsetHeight+8)+'px';panel.style.bottom=(canvas.clientHeight-bottom.offsetTop+6)+'px';panel.hidden=!panel.hidden;});document.getElementById('teamClose').addEventListener('click',()=>panel.hidden=true);for(const u of upgrades){const b=document.createElement('button');b.id='buy-'+u.id;b.className='upgrade';b.innerHTML='<span><strong></strong><small></small></span><b></b>';b.querySelector('strong').textContent=u.label;b.querySelector('small').textContent=u.desc;b.addEventListener('click',()=>selectUpgrade(u.id));document.getElementById('teamList').append(b);}
function audit(){const stored=[0,0,0];for(const s of sources)stored[s.type]+=s.stock;for(const p of[player,...workers])for(const type of p.bag)stored[type]++;for(const s of stations)for(let t=0;t<3;t++)stored[t]+=s.buffers[t];stored[0]+=packInput;for(const f of flights)if(f.kind==='stock'||f.kind==='pack')stored[f.type]++;const cash=wallet+bankCash+stations.reduce((n,s)=>n+s.stash,0)+tables.reduce((n,t)=>n+t.stash,0)+workers.reduce((n,w)=>n+w.cash,0)+stats.spent;return{cashConserved:cash===stats.earned,cash,cashEarned:stats.earned,goodsConserved:stored.every((n,t)=>n+stats.consumed[t]===stats.produced[t]),stored,consumed:stats.consumed.slice(),produced:stats.produced.slice()};}
function state(){return{id:C.id,phase,auto,elapsed,wallet,bankCash,packInput,player:{...player,path:undefined,character:'Sera',capacity:bagLimit(player)},sources:sources.map(s=>({...s})),stations:stations.map(s=>({...s,active:activeStation(s),lanes:laneCount(s)})),tables:tables.map(t=>({...t})),plots:plots.map(p=>({id:p.id,active:!p.unlock||done(p.unlock),ready:p.plants.filter(f=>f.grow>.96).length})),workers:workers.map(w=>({...w,path:undefined,hired:hired(w)})),guests:guests.map(g=>({...g})),upgrades:upgrades.map(u=>({...u})),stats:{...stats},guide:{...guide},audit:audit(),frameCount,gpu:renderer.gpu,continuous:!!C.continuous,allExpanded:upgrades.every(u=>u.done)};}
window.__journeyBatch={state};if(qa)Object.assign(window.__journeyBatch,{reset,advance(seconds){if(phase==='complete')return state();for(let i=0;i<Math.ceil(seconds*60);i++)update(Math.min(1/60,seconds-i/60));renderer.updateCamera(player.x,player.z,1,player.y);draw();return state();},setAuto(v){auto=v;clickTarget=null;player.targetKey=null;updateGuide();updateUI();},project:p=>project([p.x,p.y||0,p.z]),route,valid,teleport(x,z){if(!valid(x,z))throw Error('Blocked test position');Object.assign(player,{x,z,y:floorY(x,z),speed:0,path:[],targetKey:null});resetSeraWalk(player);renderer.updateCamera(x,z,1,player.y);draw();},fixture(data){if(data.wallet!==undefined){stats.earned+=data.wallet-wallet;wallet=data.wallet;}if(data.bag){for(const t of player.bag)stats.consumed[t]++;player.bag=data.bag.slice();for(const t of data.bag)stats.produced[t]++;}for(const id of data.upgrades||[]){const u=upgrades.find(u=>u.id===id);if(!u.done){stats.earned+=u.cost-u.paid;stats.spent+=u.cost-u.paid;u.paid=u.cost;finishUpgrade(u);}}if(data.buffers){for(const s of stations)for(let t=0;t<3;t++){stats.produced[t]+=data.buffers[t]-s.buffers[t];s.buffers[t]=data.buffers[t];}}updateGuide();updateUI();},selectUpgrade});
