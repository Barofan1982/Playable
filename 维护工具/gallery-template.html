<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Juicy Journey · 试玩</title>
<style>
:root{--header-height:64px;--page:#f5f4ec;--ink:#193e3b;--green:#164c48}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:"Microsoft YaHei",Arial,sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}a,button{touch-action:manipulation}a:focus-visible,button:focus-visible{outline:3px solid #dc793d;outline-offset:3px}
.topbar{position:sticky;top:0;z-index:20;background:var(--green);color:#fff8e5;padding-top:env(safe-area-inset-top,0px)}.header-inner{height:var(--header-height);max-width:1320px;padding:0 24px;margin:auto;display:flex;align-items:center;gap:16px}.brand{width:92px;height:55px;object-fit:contain}h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.04em}.count{margin-left:auto;color:#d0e3d7;font-size:12px}
main{max-width:1320px;margin:auto;padding:0 24px 24px}.toolbar{position:sticky;top:calc(var(--header-height) + env(safe-area-inset-top,0px));z-index:10;padding:12px 0;background:var(--page);margin-bottom:4px}.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain;touch-action:pan-x}.filters::-webkit-scrollbar,.grid::-webkit-scrollbar{display:none}.filter{flex:none;border:1px solid #d9ded0;border-radius:20px;padding:8px 16px;min-height:36px;background:#fffefa;color:#536964;font-size:12px;white-space:nowrap}.filter[aria-pressed=true]{background:var(--green);color:#fff7df;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.card{min-width:0;background:#fffefa;border:1px solid #e1e3d7;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #213f360b}.card[hidden]{display:none}.playable{display:flex;flex-direction:column;height:100%;border-radius:inherit;outline-offset:-4px}.poster{position:relative;aspect-ratio:3/4;overflow:hidden;background:#e9e8dc}.poster img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}.play-mark{position:absolute;right:10px;bottom:10px;display:grid;place-items:center;width:29px;height:29px;padding-left:2px;border-radius:50%;background:#164c48d9;color:#fff8e5;font-size:11px;box-shadow:0 2px 8px #0002}.card-body{padding:11px 12px 12px}h2{font-size:14px;line-height:1.4;margin:0 0 5px;overflow-wrap:anywhere}.category{font-size:11px;line-height:1.4;color:#75867b}.empty{color:#75867b;text-align:center;padding:40px 12px;margin:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.gallery-controls{display:none}
@media(hover:hover){.card{transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 7px 20px #213f3618}}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px),(max-height:500px) and (pointer:coarse){
 :root{--header-height:54px}html{height:100%;overflow:hidden}body{height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}.topbar{position:relative;flex-shrink:0}.header-inner{padding:0 16px;gap:12px}.brand{width:80px;height:48px}h1{font-size:15px}.count{font-size:11px}
 main{width:100%;max-width:none;flex:1;min-height:0;display:flex;flex-direction:column;padding:0}.toolbar{position:relative;top:auto;flex:none;padding:9px 16px 5px;margin:0}.filters{gap:6px}.filter{padding:6px 13px;min-height:34px;font-size:12px}
 .grid{display:flex;flex:1;min-height:0;align-items:stretch;gap:12px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;overflow-anchor:none;touch-action:pan-x;scrollbar-width:none;padding:8px max(24px,calc((100vw - 440px)/2))}
 .card{flex:0 0 min(calc(100vw - 48px),440px);scroll-snap-align:center;border-radius:17px}.poster{flex:1;min-height:0;aspect-ratio:auto;padding:8px}.poster img{object-fit:contain;border-radius:9px}.card-body{flex:none;padding:12px 15px 13px}h2{font-size:16px;margin-bottom:5px}.category{font-size:12px}.play-mark{right:16px;bottom:16px;width:32px;height:32px}
 .gallery-controls{display:flex;flex:none;align-items:center;justify-content:center;gap:24px;height:48px;padding:0 12px 4px;color:#7b8e80}.gallery-controls button{display:grid;place-items:center;border:0;border-radius:50%;width:38px;height:38px;background:#e8ecdf;color:var(--green);font-size:24px;line-height:1}.gallery-controls button:disabled{opacity:.3;cursor:default}.page-counter{font-size:12px;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}.empty{flex:1;align-content:center}
}
@media(max-height:500px) and (pointer:coarse){:root{--header-height:40px}.brand{height:36px;width:64px}.toolbar{padding-top:5px;padding-bottom:0}.filter{min-height:30px;padding:4px 12px}.grid{padding-block:6px;padding-inline:max(24px,calc((100vw - 280px)/2))}.card{flex-basis:min(280px,calc(100vw - 48px))}.card-body{padding:7px 12px}h2{font-size:13px;margin-bottom:2px}.category{font-size:10px}.gallery-controls{height:36px;padding-bottom:0}.gallery-controls button{height:30px;width:36px;font-size:20px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header class="topbar"><div class="header-inner"><img class="brand" src="corn/juicy-journey-logo.png" alt="Juicy Journey"><h1>试玩</h1><span class="count" aria-label="__COUNT__ 个试玩">__COUNT__</span></div></header>
<main>
 <div class="toolbar"><nav class="filters" aria-label="按玩法筛选">__FILTERS__</nav></div>
 <div class="sr-only" id="results" aria-live="polite">全部 __COUNT__ 个试玩</div>
 <section class="grid" id="gallery" aria-label="试玩样本">__CARDS__</section>
 <p class="empty" id="empty" hidden>没有找到试玩</p>
 <nav class="gallery-controls" aria-label="切换试玩"><button id="previous" type="button" aria-label="上一个试玩" disabled>‹</button><span class="page-counter" id="page-counter" aria-live="polite">1 / __COUNT__</span><button id="next" type="button" aria-label="下一个试玩">›</button></nav>
</main>
<script>
const filters=Array.from(document.querySelectorAll('[data-filter]')),cards=Array.from(document.querySelectorAll('.card')),gallery=document.getElementById('gallery'),previous=document.getElementById('previous'),next=document.getElementById('next'),counter=document.getElementById('page-counter');
let visible=cards.slice(),active=0,pendingFrame=0,snapTimer=0;
function updatePager(){counter.textContent=visible.length?(active+1)+' / '+visible.length:'0 / 0';previous.disabled=active===0;next.disabled=active>=visible.length-1;}
function findActive(){pendingFrame=0;if(!visible.length)return;const bounds=gallery.getBoundingClientRect(),center=bounds.left+bounds.width/2;let distance=Infinity;for(let i=0;i<visible.length;i++){const r=visible[i].getBoundingClientRect(),d=Math.abs(r.left+r.width/2-center);if(d<distance){distance=d;active=i;}}updatePager();}
function alignCard(index){if(!visible[index])return;const r=visible[index].getBoundingClientRect(),g=gallery.getBoundingClientRect(),left=gallery.scrollLeft+r.left-g.left-(g.width-r.width)/2;if(Math.abs(gallery.scrollLeft-left)>1)gallery.scrollTo({left,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}
function go(delta){clearTimeout(snapTimer);const destination=Math.max(0,Math.min(visible.length-1,active+delta));alignCard(destination);}
for(const filter of filters)filter.addEventListener('click',()=>{const selected=filter.dataset.filter;clearTimeout(snapTimer);if(pendingFrame)cancelAnimationFrame(pendingFrame);pendingFrame=0;gallery.scrollTo({left:0,behavior:'instant'});for(const button of filters)button.setAttribute('aria-pressed',String(button===filter));for(const card of cards)card.hidden=selected!=='全部'&&card.dataset.type!==selected;visible=cards.filter(card=>!card.hidden);active=0;gallery.scrollTo({left:0,behavior:'instant'});document.getElementById('results').textContent=selected+'，'+visible.length+' 个试玩';document.getElementById('empty').hidden=visible.length!==0;updatePager();});
gallery.addEventListener('scroll',()=>{if(!pendingFrame)pendingFrame=requestAnimationFrame(findActive);clearTimeout(snapTimer);if(getComputedStyle(gallery).display==='flex')snapTimer=setTimeout(()=>{findActive();alignCard(active);},150);},{passive:true});previous.addEventListener('click',()=>go(-1));next.addEventListener('click',()=>go(1));window.addEventListener('resize',()=>requestAnimationFrame(findActive));updatePager();
</script>
</body>
</html>
