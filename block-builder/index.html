 function fan(){const x=284,y=403;ctx.save();for(let i=0;i<4;i++){const sy=374+i*20;ctx.strokeStyle='#6de2f04b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x-20,sy);ctx.bezierCurveTo(x-70,sy-17,x-125,sy+11,91,sy-9);ctx.stroke();}ctx.translate(x,y);ball(0,0,14,'#d9b54e');ctx.strokeStyle='#ab8533';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,10,18,.25,0,Math.PI*2);ctx.stroke();ctx.rotate(t*6);ctx.fillStyle='#398564';for(let i=0;i<3;i++){ctx.rotate(2*Math.PI/3);ctx.beginPath();ctx.ellipse(0,-7,4,9,.5,0,Math.PI*2);ctx.fill();}ball(0,0,3,'#c29438');ctx.restore();}
 const hints=['点绿色球，让绿板弹起蓝球','拖至斜带凹口：亮橙 → 暗橙','先放青球，再放橙球','释放顺序：蓝 → 黄 → 红 → 绿','先推灰球破石台，再放紫色盖板'];
 function overlay(){const st=game.state(),hintY=Math.min(538,640-48*640/(canvas.clientHeight||640)-40);ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';if(st.status==='failed'){ctx.fillStyle='#f91c35';ctx.lineCap='round';ctx.lineWidth=21;ctx.beginPath();ctx.moveTo(128,265);ctx.lineTo(232,369);ctx.moveTo(232,265);ctx.lineTo(128,369);ctx.strokeStyle='#ed1830';ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.stroke();ctx.shadowBlur=0;ctx.font='bold 16px "Microsoft YaHei",sans-serif';ctx.fillStyle='#b51b2b';ctx.fillText(st.message,180,Math.min(504,hintY-12));}
 else if(st.status==='won'||st.status==='complete'){ctx.strokeStyle='#12bd53';ctx.lineWidth=17;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(134,303);ctx.lineTo(170,336);ctx.lineTo(236,269);ctx.stroke();if(st.status==='complete'){ctx.font='900 25px "Trebuchet MS",sans-serif';ctx.fillStyle='#3b2454';ctx.fillText('COLOR BLOCK',180,hintY-31);ctx.font='bold 14px "Microsoft YaHei",sans-serif';ctx.fillText('五关完成！',180,hintY);}}
 else{ctx.font='12px "Trebuchet MS",sans-serif';ctx.fillStyle='#9e9b91';ctx.fillText('LEVEL '+st.level+' / 5',180,hintY+21);}
 if(st.auto&&st.status==='playing'){const held=game.objects.filter(b=>b.game.held);const action=game.actions[st.autoNext],item=action&&held.find(b=>b.label===action.name);if(item){ctx.strokeStyle='#00e815';ctx.lineWidth=3;ctx.globalAlpha=.65+.35*Math.sin(t*7);ctx.beginPath();ctx.arc(item.position.x,item.position.y,(item.game.r||22)+6,0,Math.PI*2);ctx.stroke();}}ctx.restore();}
 function draw(){ctx.setTransform(2,0,0,2,0,0);background();for(const b of game.terrain)body(b);if(game.level===2)belt();if(game.level===3){blower(121,284,'blue',1);blower(241,284,'orange',-1);}for(const b of game.objects){if(b.game.terrain||b.game.belt)continue;body(b);}if(game.level===4)fan();for(const p of game.particles)ball(p.x,p.y,p.size,'#555a5a',Math.min(1,p.life));goal();overlay();}
 function frame(now){const dt=last?Math.min((now-last)/1000,.05):1/60;last=now;if(!hidden&&!game.paused){t+=dt;accumulator+=dt;while(accumulator>=1/60){game.update(1/60);accumulator-=1/60;}}else accumulator=0;draw();syncControls();requestAnimationFrame(frame);}
 // Instantiate before attaching the notification callback to controls.
 requestAnimationFrame(frame);
